    (sc.notes ? '<tr><td>Context notes</td><td>' + esc(sc.notes) + '</td></tr>' : '') +
    '</tbody></table>';
  h += '<h2>Profile</h2><div class="chart-wrap">' + Chart.svg(MODEL, rows, { compact: !!opts.compact }).replace(/pc-title/g, 'rp-title').replace(/pc-desc/g, 'rp-desc') + '</div>' + Chart.legend() + Chart.table(MODEL, rows);
  h += '<h2>Constraining dimension</h2>' + constrainingHTML(d);
  h += '<h2>Claimed and evidenced</h2>' + gapsHTML(d);
  h += '<h2>Flags and their resolutions</h2>' + flagsHTML(d, false);
  h += '<h2>Anti-pattern check</h2><table class="data"><thead><tr><th scope="col">Anti-pattern</th><th scope="col">Response</th><th scope="col">Note</th></tr></thead><tbody>' +
    MODEL.antiPatterns.map(function (ap) {
      var r = s.antiPatterns[ap.id] || {};
      return '<tr><th scope="row">' + esc(ap.name) + '</th><td>' + esc(ModelMod.apLabel(MODEL, r.response)) + '</td><td>' + esc(r.note || '') + '</td></tr>';
    }).join('') + '</tbody></table>';
  var agreed = [], other = [];
  groups.forEach(function (g) {
    g.next.forEach(function (st) {
      var ns = s.nextSteps[st.id] || {};
      (ns.priority ? agreed : other).push({ g: g, st: st, ns: ns });
    });
  });
  h += '<h2>Next steps</h2>';
  h += '<h3>Agreed priorities</h3>';
  if (agreed.length) {
    h += '<table class="data"><thead><tr><th scope="col">Dimension</th><th scope="col">Next step</th><th scope="col">Owner</th><th scope="col">Note</th></tr></thead><tbody>' +
      agreed.map(function (x) { return '<tr><td>' + esc(x.g.name) + '</td><td>' + esc(x.st.action) + '</td><td>' + esc(x.ns.owner || '') + '</td><td>' + esc(x.ns.note || '') + '</td></tr>'; }).join('') + '</tbody></table>';
  } else h += '<p>No next steps have been marked as agreed priorities.</p>';
  h += '<h3>Other next steps</h3>';
  if (other.length) {
    h += '<table class="data"><thead><tr><th scope="col">Dimension</th><th scope="col">Next step</th></tr></thead><tbody>' +
      other.map(function (x) { return '<tr><td>' + esc(x.g.name) + '</td><td>' + esc(x.st.action) + (x.ns.owner ? ' Owner: ' + esc(x.ns.owner) + '.' : '') + '</td></tr>'; }).join('') + '</tbody></table>';
  } else h += '<p>No other next steps.</p>';
  var gapRows = [];
  groups.forEach(function (g) { g.gaps.forEach(function (st) { gapRows.push({ g: g, st: st }); }); });
  if (gapRows.length) {
    h += '<h3>Documented, not yet practised</h3><table class="data"><thead><tr><th scope="col">Dimension</th><th scope="col">Statement</th></tr></thead><tbody>' +
      gapRows.map(function (x) { return '<tr><td>' + esc(x.g.name) + '</td><td>' + esc(x.st.text) + '</td></tr>'; }).join('') + '</tbody></table>';
  }
  h += '<h2>Dimension notes and confidence</h2><table class="data"><thead><tr><th scope="col">Dimension</th><th scope="col">Confidence</th><th scope="col">Evidence</th><th scope="col">Notes</th></tr></thead><tbody>' +
    MODEL.dimensions.map(function (dim) {
      var n = s.dimensionNotes[dim.id];
      return '<tr><th scope="row">' + esc(dim.name) + '</th><td>' + esc(n.confidence.charAt(0).toUpperCase() + n.confidence.slice(1)) + (n.confidenceSource === 'chosen' ? '' : ' (suggested)') + '</td><td>' + esc(n.evidence) + '</td><td>' + esc(n.notes) + '</td></tr>';
    }).join('') + '</tbody></table>';
  h += '<h2>Three cautions</h2>' + T.cautions.map(function (c) { return '<p><strong>' + esc(c.title) + '</strong> ' + esc(c.text) + '</p>'; }).join('');
  var foot = [esc(T.privacy)];
  var credit = [];
  if (!isPlaceholder(CONFIG.attribution)) credit.push(esc(CONFIG.attribution) + '.');
  if (!isPlaceholder(CONFIG.author)) credit.push('Author: ' + esc(CONFIG.author) + '.');
  if (!isPlaceholder(CONFIG.publisher)) credit.push('Publisher: ' + esc(CONFIG.publisher) + '.');
  if (!isPlaceholder(CONFIG.licence)) credit.push('Licence: ' + esc(CONFIG.licence) + '.');
  if (!isPlaceholder(CONFIG.contact)) credit.push('Contact: ' + esc(CONFIG.contact) + '.');
  if (credit.length) foot.push(credit.join(' '));
  foot.push('Model version ' + esc(s.modelVersion) + '. Tool version ' + esc(TOOL_VERSION) + '. Report produced ' + esc(formatDate(todayISO())) + '.');
  h += '<div class="footer-block">' + foot.map(function (f) { return '<p>' + f + '</p>'; }).join('') + '</div></article>';
  return h;
}

function renderReportScreen() {
  var h = '<div class="screen"><h1 tabindex="-1">Report</h1><p class="lead">This is the whole assessment in a form ready to print or save as PDF through the browser\'s print dialogue.</p>' +
    '<div class="report-toolbar"><button type="button" class="btn btn-primary" data-action="print">Print report</button>' +
    '<button type="button" class="btn" data-action="export-json">Export assessment</button>' +
    '<button type="button" class="btn" data-action="export-csv">Export responses as CSV</button></div></div>';

/* ---------- export and import ---------- */

function exportFilename(ext) {
  var s = app.state;
  return 'hdomm-' + slugify(s.scope.organisation || s.scope.title) + '-' + todayISO() + '.' + ext;
}
function exportJSON() {
  Store.download(exportFilename('json'), JSON.stringify(app.state, null, 2), 'application/json');
  app.ui.unprotected = false;
  showConfirm('Assessment exported');
}
function exportCSV() {
  Store.download(exportFilename('csv'), Store.toCSV(app.state, MODEL, respOf(app.state)), 'text/csv;charset=utf-8');
  showConfirm('Responses exported as CSV');
}

/* Returns an error sentence, or null on success. The current state is untouched on failure. */
function importText(text, filename) {
  var obj;
  try { obj = JSON.parse(text); } catch (e) { return 'This file is not valid JSON, so it cannot be opened.'; }
  var res = Store.validate(obj, MODEL);
  if (!res.ok) return res.reason;
  loadState(res.state);
  app.ui.importNotice = { message: 'Assessment opened from ' + (filename || 'the chosen file') + '.', model: res.notice };
  if (app.ui.storageOK) { if (Store.save(app.state)) { app.ui.unsavedToDevice = false; app.ui.unprotected = false; } }
  else { app.ui.unsavedToDevice = true; app.ui.unprotected = false; }
  return null;
}

function loadState(s) {
  app.state = normalise(s);
  app.ui.openNotes = {};
  app.ui.lastEv = {};
  app.ui.scopeErrors = null;
  app.ui.startPanel = null;
  app.ui.startError = null;
  app.ui.chartAnimated = false;
}

function confirmReplace() {
  if (app.state && app.ui.unprotected && !app.ui.storageOK) {
    return window.confirm('The current assessment has changes that have not been exported and cannot be kept on this device. Replace it anyway?');
  }
  return true;
}

/* ---------- events ---------- */

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-action]');
  if (!el) return;
  var a = el.getAttribute('data-action');
  if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
  switch (a) {
    case 'go': ev.preventDefault(); go(el.getAttribute('data-screen')); break;
    case 'new':
      if (!confirmReplace()) return;
      loadState(newAssessment());
      app.ui.unsavedToDevice = true; app.ui.unprotected = false;
      scheduleSave();
      go('scope');
      break;
    case 'start-panel':
      var p = el.getAttribute('data-panel');
      app.ui.startPanel = app.ui.startPanel === p ? null : p;
      app.ui.startError = null;
      renderScreen();
      var btn = $screen.querySelector('[data-panel="' + p + '"]');
      if (btn) btn.focus();
      break;
    case 'choose-file': document.getElementById('file-input').click(); break;
    case 'open-saved':
      if (!confirmReplace()) return;
      var loaded = Store.load(el.getAttribute('data-id'));
      var res = loaded ? Store.validate(loaded, MODEL) : { ok: false, reason: 'This saved assessment could not be read from the device.' };
      if (!res.ok) { app.ui.startError = res.reason; renderScreen(); return; }
      loadState(res.state);
      app.ui.unsavedToDevice = false; app.ui.unprotected = false;
      if (res.notice) { app.ui.importNotice = { message: 'Assessment opened from this device.', model: res.notice }; scheduleSave(); }
      Store.save(app.state);
      go(app.state.scope.title ? 'profile' : 'scope');
      break;
    case 'remove-saved':
      var id = el.getAttribute('data-id');
      if (!window.confirm('Remove this assessment from this device? Exported files are not affected.')) return;
      Store.remove(id);
      if (app.state && app.state.id === id) { clearTimeout(app.ui.saveTimer); app.state = null; app.ui.unprotected = false; }
      renderAll();
      announce('Assessment removed from this device');
      break;
    case 'dismiss-notice': app.ui.importNotice = null; renderBanner(); $screen.querySelector('h1') && $screen.querySelector('h1').focus(); break;
    case 'export-json': exportJSON(); break;
    case 'export-csv': exportCSV(); break;
    case 'print': window.print(); break;
    case 'scope-continue':
      var errs = scopeErrors(app.state);
      app.ui.scopeErrors = errs.length ? errs : null;
      if (errs.length) { renderScreen(); document.getElementById('scope-errors').focus(); }
      else go('how');
      break;
    case 'focus-field':
      ev.preventDefault();
      var f = document.getElementById(el.getAttribute('data-target'));
      if (f) f.focus();
      break;
    case 'tag-add': addTag(); break;
    case 'tag-remove':
      var i = parseInt(el.getAttribute('data-i'), 10), removed = app.state.scope.priorityData[i];
      setState(function (s) { s.scope.priorityData.splice(i, 1); });
      document.getElementById('sc-tag').focus();
      announce('Removed ' + removed);
      break;
    case 'toggle-note':
      var key = el.getAttribute('data-st'), wrap = document.getElementById('nw-' + key);
      app.ui.openNotes[key] = !app.ui.openNotes[key];
      wrap.hidden = !app.ui.openNotes[key];
      el.setAttribute('aria-expanded', String(!!app.ui.openNotes[key]));
      var noteVal = document.getElementById('n-' + key).value;
      el.textContent = noteToggleLabel(!!app.ui.openNotes[key], noteVal);
      if (app.ui.openNotes[key]) document.getElementById('n-' + key).focus();
      break;
    case 'toggle-table':
      app.ui.showTable = !app.ui.showTable;
      document.getElementById('profile-table').className = app.ui.showTable ? '' : 'sr-only';
      el.setAttribute('aria-expanded', String(app.ui.showTable));
      el.textContent = app.ui.showTable ? 'Hide the data table' : 'Show the data table';
      break;
    case 'flag-revisit':
      var fid = el.getAttribute('data-flag'), dim = el.getAttribute('data-dim');
      setState(function (s) { s.flagResolutions[fid] = { status: 'revisited', rationale: '' }; }, { render: false });
      go(dim);
      break;
    case 'flag-stands':
      app.ui.flagEditing = el.getAttribute('data-flag'); app.ui.flagError = null;
      renderScreen();
      document.getElementById('rat-' + app.ui.flagEditing).focus();
      break;
    case 'flag-cancel':
      var was = app.ui.flagEditing;
      app.ui.flagEditing = null; app.ui.flagError = null;
      renderScreen();
      var back = $screen.querySelector('#flag-' + was + ' [data-action="flag-stands"]');
      if (back) back.focus();
      break;
    case 'flag-save':
      var flagId = el.getAttribute('data-flag'), val = document.getElementById('rat-' + flagId).value.trim();
      if (!val) {
        app.ui.flagError = 'Enter a one-line rationale to record that the level stands.';
        renderScreen();
        document.getElementById('rat-' + flagId).focus();
        return;
      }
      app.ui.flagEditing = null; app.ui.flagError = null;
      setState(function (s) { s.flagResolutions[flagId] = { status: 'stands', rationale: val }; });
      var fb = $screen.querySelector('#flag-' + flagId + ' [data-action="flag-stands"]');
      if (fb) fb.focus();
      announce('Rationale recorded');
      break;
  }
});

function addTag() {
  var input = document.getElementById('sc-tag'), v = input.value.trim();
  if (!v) { input.focus(); return; }
  if (app.state.scope.priorityData.length >= 8) return;
  if (app.state.scope.priorityData.some(function (t) { return t.toLowerCase() === v.toLowerCase(); })) { input.value = ''; input.focus(); return; }
  setState(function (s) { s.scope.priorityData.push(v); });
  var ni = document.getElementById('sc-tag');
  if (ni && !ni.disabled) ni.focus(); else { var last = $screen.querySelector('.tags li:last-child button'); if (last) last.focus(); }
  announce('Added ' + v);
}

document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'sc-tag') { ev.preventDefault(); addTag(); }
  if (ev.key === 'Enter' && ev.target && ev.target.id && ev.target.id.indexOf('rat-') === 0) {
    ev.preventDefault();
    var b = $screen.querySelector('[data-action="flag-save"]');
    if (b) b.click();
  }
  if (ev.key === 'Escape' && $rail.classList.contains('open')) { closeRail(); document.getElementById('menu-btn').focus(); }
});

$screen.addEventListener('change', function (ev) {
  var el = ev.target, a = el.getAttribute('data-action');
  if (!a) return;
  if (a === 'practice') {
    var sid = el.getAttribute('data-st'), dim = MODEL.idx.statementById[sid].dim;
    setState(function (s) { entryFor(s, sid).practice = el.value; }, { update: function () { refreshDimension(dim); } });
  } else if (a === 'documented') {
    var sid2 = el.getAttribute('data-st'), dim2 = MODEL.idx.statementById[sid2].dim;
    setState(function (s) { entryFor(s, sid2).documented = el.checked; }, { update: function () { refreshDimension(dim2); } });
  } else if (a === 'confidence') {
    var d = el.getAttribute('data-dim');
    setState(function (s) { s.dimensionNotes[d].confidence = el.value; s.dimensionNotes[d].confidenceSource = 'chosen'; }, { update: function () { refreshDimension(d); } });
  } else if (a === 'ap-response') {
    var apid = el.getAttribute('data-ap');
    setState(function (s) { if (!s.antiPatterns[apid]) s.antiPatterns[apid] = { response: '', note: '' }; s.antiPatterns[apid].response = el.value; }, { render: false });
  } else if (a === 'scope-unit') {
    setState(function (s) { s.scope.unit = el.value; }, { render: false });
  } else if (a === 'ns-priority') {
    var nsid = el.getAttribute('data-st');
    setState(function (s) { nsEntry(s, nsid).priority = el.checked; }, { render: false });
  } else if (a === 'scope-text' && el.type === 'date') {
    setState(function (s) { s.scope.date = el.value; }, { render: false });
  }
});

function nsEntry(s, sid) { if (!s.nextSteps[sid]) s.nextSteps[sid] = { priority: false, owner: '', note: '' }; return s.nextSteps[sid]; }

$screen.addEventListener('input', function (ev) {
  var el = ev.target, a = el.getAttribute('data-action');
  if (!a) return;
  var v = el.value;
  if (a === 'scope-text') {
    var k = el.getAttribute('data-key');
    setState(function (s) { s.scope[k] = v; }, { render: false });
  } else if (a === 'participants-text') {
    setState(function (s) { s.participants[0].label = v; }, { render: false });
  } else if (a === 'note') {
    var sid = el.getAttribute('data-st');
    setState(function (s) { entryFor(s, sid).note = v; }, { render: false });
  } else if (a === 'ap-note') {
    var apid = el.getAttribute('data-ap');
    setState(function (s) { if (!s.antiPatterns[apid]) s.antiPatterns[apid] = { response: '', note: '' }; s.antiPatterns[apid].note = v; }, { render: false });
  } else if (a === 'dimnote') {
    var d = el.getAttribute('data-dim'), key = el.getAttribute('data-key');
    setState(function (s) { s.dimensionNotes[d][key] = v; }, { render: false });
  } else if (a === 'ns-text') {
    var nsid = el.getAttribute('data-st'), nk = el.getAttribute('data-key');
    setState(function (s) { nsEntry(s, nsid)[nk] = v; }, { render: false });
  }
});

document.getElementById('file-input').addEventListener('change', function (ev) {
  var file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  if (!confirmReplace()) return;
  var reader = new FileReader();
  reader.onload = function () {
    var err = importText(String(reader.result), file.name);
    if (err) { app.ui.startError = err; app.ui.startPanel = 'open'; app.screen = 'start'; renderAll(); var al = $screen.querySelector('[role="alert"]'); if (al) { al.setAttribute('tabindex', '-1'); al.focus(); } }
    else go(app.state.scope.title ? 'profile' : 'scope');
  };
  reader.onerror = function () { app.ui.startError = 'The file could not be read. Try choosing it again.'; renderScreen(); };
  reader.readAsText(file);
});

var menuBtn = document.getElementById('menu-btn');
menuBtn.addEventListener('click', function () {
  var open = !$rail.classList.contains('open');
  $rail.classList.toggle('open', open);
  menuBtn.setAttribute('aria-expanded', String(open));
  if (open) { var first = $rail.querySelector('button'); if (first) first.focus(); }
});
function closeRail() { $rail.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); }

window.addEventListener('beforeunload', function (ev) {
  if (app.state && app.ui.unprotected) { ev.preventDefault(); ev.returnValue = ''; return ''; }
});

window.addEventListener('beforeprint', function () {
  if (!app.state) return;
  document.getElementById('print-root').innerHTML = reportHTML({ compact: false });
});

var resizeTimer = null;
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    if ((app.screen === 'profile' || app.screen === 'report') && app.ui.compact !== null && isCompact() !== app.ui.compact) {
      var y = window.scrollY; renderScreen(); window.scrollTo(0, y);
    }
  }, 200);
});

/* ---------- self-test: window.hdommSelfTest() ---------- */

function buildResp(dimId, fn) {
  var r = {};
  for (var n = 2; n <= 5; n++) Levels.statementsAt(MODEL, dimId, n).forEach(function (s, i) {
    var v = fn(s, n, i);
    if (v) r[s.id] = { practice: v.p || '', documented: !!v.d, note: '' };
  });
  return r;
}
function flatProfile(levels) {
  var p = {};
  MODEL.dimensions.forEach(function (d) { var v = levels[d.id] || 1; p[d.id] = { ev: v, cl: v }; });
  return p;
}
function userFacingStrings() {
  var out = [];
  (function walk(x) {
    if (typeof x === 'string') out.push(x);
    else if (Array.isArray(x)) x.forEach(walk);
    else if (isObj(x)) Object.keys(x).forEach(function (k) { walk(x[k]); });
  })(JSON.parse(document.getElementById('hdomm-model').textContent));
  return out;
}
function textOfHTML(html) { var t = document.createElement('template'); t.innerHTML = html; return t.content.textContent || ''; }

window.hdommSelfTest = function () {
  var results = [];
  function check(id, desc, ok, detail) { results.push({ test: id, description: desc, result: ok ? 'as expected' : 'NOT AS EXPECTED', detail: detail || '' }); }
  var ev, cl, r;

  r = buildResp('SG', function (s, n) { return n <= 4 ? { p: 'inplace' } : null; });
  ev = Levels.evidenced(MODEL, 'SG', r);
  check('L1', 'Levels 2 and 3 In place, Level 4 In place only: evidenced Defined', ev === 3, 'evidenced ' + ModelMod.levelName(MODEL, ev));

  r = buildResp('SG', function (s, n) { return s.id === 'SG-2-1' ? { p: 'partly' } : { p: 'holds' }; });
  ev = Levels.evidenced(MODEL, 'SG', r);
  var ahead = Levels.practiceAhead(MODEL, 'SG', r, ev);
  var line = ahead ? fill(TPL.cumulative, { higher: ModelMod.levelName(MODEL, ahead), next: ModelMod.levelName(MODEL, ev + 1) }) : '';
  check('L2', 'SG-2-1 Partly, Levels 3 to 5 Holds: evidenced Reactive with the cumulative line', ev === 1 && !!ahead, 'evidenced ' + ModelMod.levelName(MODEL, ev) + '; line: ' + line);

  r = buildResp('SG', function (s) { return s.id === 'SG-2-1' ? { p: 'unknown' } : { p: 'holds' }; });
  ev = Levels.evidenced(MODEL, 'SG', r);
  var conf = Levels.suggestedConfidence(MODEL, 'SG', r), unk = Levels.unknownCount(MODEL, 'SG', r);
  check('L3', 'Not known at Level 2: evidenced Reactive, suggested confidence low, visible note', ev === 1 && conf === 'low' && unk === 1, 'evidenced ' + ModelMod.levelName(MODEL, ev) + ', confidence ' + conf + ', note: ' + TPL.unknownOne);

  r = buildResp('SG', function (s, n) { return { p: 'inplace', d: true }; });
  ev = Levels.evidenced(MODEL, 'SG', r); cl = Levels.claimed(MODEL, 'SG', r);
  check('L4', 'All Documented, practice In place: claimed Anticipatory, evidenced Defined, gap 2', cl === 5 && ev === 3 && cl - ev === 2, 'claimed ' + ModelMod.levelName(MODEL, cl) + ', evidenced ' + ModelMod.levelName(MODEL, ev));

  var f1 = Flags.dependency(MODEL, flatProfile({ FA: 4, CC: 2, SG: 4, AS: 4, PA: 3, LC: 3 })).some(function (f) { return f.id === 'dep-FA-CC'; });
  var f2 = Flags.dependency(MODEL, flatProfile({ FA: 3, CC: 2, SG: 3, AS: 3, PA: 3, LC: 3 })).some(function (f) { return f.id === 'dep-FA-CC'; });
  check('L5', 'Dependency flag for FA Sustained over CC Aware, none for FA Defined', f1 && !f2, 'first case raised: ' + f1 + ', second case raised: ' + f2);

  var profL6 = flatProfile({ LC: 3, CC: 1 });
  var t1 = Flags.antiPattern(MODEL, profL6, { AP1: { response: 'recurring' } }).some(function (f) { return f.id === 'ap-AP1'; });
  var t2 = Flags.antiPattern(MODEL, profL6, { AP1: { response: 'once' } }).some(function (f) { return f.id === 'ap-AP1'; });
  check('L6', 'AP1 Recurring with LC Defined raises a flag; Observed once does not', t1 && !t2, 'recurring: ' + t1 + ', once: ' + t2);

  var con = constrainingOf(MODEL, flatProfile({ SG: 1, CC: 1, PA: 3, AS: 3, LC: 3, FA: 3 }));
  check('L7', 'SG and CC tie lowest: CC is constraining', con.id === 'CC', 'chosen ' + con.id);

  var saved = app.state, savedScreen = app.screen, savedUI = { chartAnimated: app.ui.chartAnimated, flagEditing: app.ui.flagEditing };
  var sample = normalise(newAssessment());
  sample.scope.title = 'Self-test'; sample.scope.organisation = 'Self-test service'; sample.scope.unit = 'service'; sample.scope.priorityData = ['medication'];
  var sr = sample.responses.p1;
  MODEL.dimensions.forEach(function (d, di) {
    for (var n = 2; n <= 5; n++) Levels.statementsAt(MODEL, d.id, n).forEach(function (s, i) {
      sr[s.id] = { practice: ['holds', 'inplace', 'partly', 'unknown', 'not'][(di + n + i) % 5], documented: (n + i) % 2 === 0, note: '' };
    });
  });
  sample.antiPatterns = { AP1: { response: 'recurring', note: '' }, AP2: { response: 'unknown', note: '' }, AP3: { response: 'once', note: '' } };
  app.state = normalise(sample);
  var screens = ['start', 'scope', 'how'].concat(MODEL.dimensions.map(function (d) { return d.id; })).concat(['ap', 'profile', 'next', 'report']);
  var bad = [], allText = [];
  var renderers = { start: renderStart, scope: renderScope, how: renderHow, ap: renderAntiPatterns, profile: renderProfile, next: renderNextSteps, report: renderReportScreen };
  screens.forEach(function (k) {
    var html = renderers[k] ? renderers[k]() : renderDimension(k);
    var txt = textOfHTML(html);
    allText.push(txt);
    if (/%|\baverage\b|\btotal\b|percent|\blevel \d+\.\d/i.test(txt)) bad.push(k);
  });
  check('L8', 'No screen shows a total, an average, a percentage or a fractional level', bad.length === 0, bad.length ? 'found on: ' + bad.join(', ') : 'checked ' + screens.length + ' screens');

  var json = JSON.stringify(app.state);
  var back = Store.validate(JSON.parse(json), MODEL);
  check('P1', 'Export and re-import produce identical state', back.ok && JSON.stringify(back.state) === json, back.ok ? 'round trip compared' : back.reason);
  app.state = saved; app.screen = savedScreen; app.ui.chartAnimated = savedUI.chartAnimated; app.ui.flagEditing = savedUI.flagEditing;

  var before = JSON.stringify(app.state);
  var e1 = importText('{not json', 'test.json');
  var e2 = importText(JSON.stringify({ schema: 'something-else' }), 'test.json');
  var e3 = importText(JSON.stringify(Object.assign(clone(sample), { responses: { p1: { 'SG-2-1': { practice: 'maybe' } } } })), 'test.json');
  var oneSentence = [e1, e2, e3].every(function (e) { return e && (e.match(/[.!?](\s|$)/g) || []).length === 1; });
  check('P2', 'Malformed files are rejected with a one-sentence reason and state is untouched', oneSentence && JSON.stringify(app.state) === before, [e1, e2, e3].join(' | '));

  var strings = userFacingStrings().concat(allText).concat(Object.keys(CONFIG).map(function (k) { return String(CONFIG[k]); }));
  var joined = strings.join('\n');
  var emdash = document.documentElement.outerHTML.indexOf('\u2014') >= 0 || joined.indexOf('\u2014') >= 0;
  var verdict = joined.match(/\b(score|scores|scored|scoring|grade|grades|graded|pass|passed|fail|failed)\b/gi) || [];
  var ratingNoun = joined.match(/\b(a|the|your|its)\s+rating\b/gi) || [];
  var us = joined.match(/\b(organization|organizations|color|behavior|analyze|analyzed|center|recognize|recognized|prioritize|standardize|catalog|favor|license)\b/gi) || [];
  check('O4', 'No em-dashes, no prohibited words, only UK spellings', !emdash && !verdict.length && !ratingNoun.length && !us.length,
    'em-dash: ' + emdash + '; verdict words: ' + (verdict.join(', ') || 'none') + '; US spellings: ' + (us.join(', ') || 'none'));
  var inflected = joined.match(/\b(fails|failures?|failing|passes|passing)\b/gi) || [];
  if (inflected.length) results.push({ test: 'O4 note', description: 'Inflected forms found in canonical model wording, for the author to review', result: 'note', detail: inflected.join(', ') });

  var bytes = new Blob([document.documentElement.outerHTML]).size;
  check('O5', 'File under 300 KB', bytes < 300 * 1024, Math.round(bytes / 1024) + ' KB as rendered');

  if (window.console && console.table) console.table(results);
  renderAll();
  return results;
};

/* ---------- boot ---------- */

app.ui.storageOK = Store.testAvailable();
if (app.ui.storageOK) {
  var last = Store.lastId();
  if (last) {
    var st = Store.load(last);
    var vr = st ? Store.validate(st, MODEL) : null;
    if (vr && vr.ok) { loadState(vr.state); if (vr.notice) app.ui.importNotice = { message: 'Assessment reopened from this device.', model: vr.notice }; }
  }
}
renderAll();

})();
</script>
