<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Health Data Operability Maturity Assessment</title>
<style>
:root {
  --ink: #17324A;
  --paper: #EDF3F8;
  --rule: #C7D5E3;
  --slate: #5B7187;
  --evidence: #4F7EB1;
  --flag: #9A5F0E;
  --white: #FFFFFF;
  --tint: #EAF1F8;
  --flag-tint: #F7EFE4;
  --sans: Arial, Helvetica, sans-serif;
  --serif: Georgia, "Times New Roman", serif;
  --header-h: 60px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.45;
}
[hidden] { display: none !important; }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 3px solid var(--evidence); outline-offset: 2px; }
.skip {
  position: absolute; left: 12px; top: -60px; z-index: 50;
  background: var(--white); color: var(--ink); padding: 10px 14px; border: 2px solid var(--ink);
}
.skip:focus { top: 10px; }

/* Header */
.app-header {
  position: sticky; top: 0; z-index: 20;
  min-height: var(--header-h);
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px 20px;
  padding: 10px 24px;
  background: var(--white);
  border-bottom: 1px solid var(--rule);
}
.tool-title { font-weight: 700; font-size: 16px; }
.hdr-name { color: var(--slate); font-size: 15px; max-width: 32ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hdr-spacer { flex: 1 1 auto; }
.hdr-meta { font-size: 14px; color: var(--slate); display: flex; gap: 16px; align-items: center; }
.hdr-save.unsaved { color: var(--flag); }
.hdr-confirm { font-size: 14px; color: var(--evidence); font-weight: 700; }
.app-header .menu-btn { display: none; }

/* Buttons */
button { font: inherit; color: inherit; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 40px; padding: 8px 16px;
  font-family: var(--sans); font-size: 15px; line-height: 1.2;
  border-radius: 4px; border: 1px solid var(--slate);
  background: var(--white); color: var(--ink); cursor: pointer;
  text-decoration: none;
}
.btn:hover { background: #F5F8FB; }
.btn-primary { background: var(--evidence); border-color: var(--evidence); color: var(--white); }
.btn-primary:hover { background: #3E6897; }
.btn-small { min-height: 32px; padding: 5px 12px; font-size: 14px; }
.btn-link {
  background: none; border: 0; padding: 4px 2px; min-height: 28px;
  color: var(--evidence); text-decoration: underline; text-underline-offset: 3px;
  cursor: pointer; font-size: 15px;
}
.btn-link:hover { color: #3E6897; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0; }

/* Layout */
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - var(--header-h)); }
.rail {
  border-right: 1px solid var(--rule);
  padding: 20px 0 40px;
  background: var(--paper);
}
.rail ul { list-style: none; margin: 0; padding: 0; }
.rail li + li.group-start { margin-top: 14px; }
.rail button {
  display: flex; align-items: flex-start; gap: 10px; width: 100%;
  min-height: 36px; padding: 7px 20px 7px 21px;
  background: none; border: 0; border-left: 3px solid transparent;
  text-align: left; font-size: 15px; cursor: pointer; color: var(--ink);
}
.rail button:hover { background: #F5F8FB; }
.rail button[aria-current="page"] { border-left-color: var(--evidence); font-weight: 700; background: var(--white); }
.rail .mark { flex: 0 0 14px; margin-top: 3px; }
.rail .mark-space { display: inline-block; width: 14px; flex: 0 0 14px; }
main { padding: 32px 48px 96px; min-width: 0; }
main:focus { outline: none; }
.screen { max-width: 72ch; }

/* Type */
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 12px; font-weight: 700; }
h2 { font-size: 20px; line-height: 1.3; margin: 36px 0 10px; font-weight: 700; }
h3 { font-size: 17px; line-height: 1.3; margin: 24px 0 8px; font-weight: 700; }
h1:focus { outline: none; }
.prose, .prose p, p.prose { font-family: var(--serif); font-size: 17px; line-height: 1.55; }
p { margin: 0 0 14px; }
.lead { font-family: var(--serif); font-size: 18px; line-height: 1.55; margin-bottom: 6px; }
.quiet-text { color: var(--slate); font-size: 14px; }
.bookref { color: var(--slate); font-size: 14px; margin-bottom: 20px; }

/* Banners and panels */
.banner {
  margin: 0 0 24px; padding: 12px 16px; max-width: 72ch;
  border: 1px solid var(--rule); border-left: 4px solid var(--slate); background: var(--white);
  font-size: 15px;
}
.banner.notice { border-left-color: var(--evidence); }
.banner.error { border-left-color: var(--flag); }
.banner p:last-child { margin-bottom: 0; }
.panel { background: var(--white); border: 1px solid var(--rule); border-radius: 4px; padding: 16px 20px; margin: 16px 0; }
.privacy { border-left: 4px solid var(--evidence); }
.cautions p { font-family: var(--serif); font-size: 17px; line-height: 1.55; }
.cautions strong { font-family: var(--sans); font-size: 16px; }
.saved-list { list-style: none; padding: 0; margin: 12px 0; }
.saved-list li { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 0; border-top: 1px solid var(--rule); }
.saved-list .saved-title { flex: 1 1 260px; }

/* Forms */
.field { margin: 0 0 22px; }
.field > label, .field > .label, fieldset.field > legend { display: block; font-weight: 700; font-size: 15px; margin-bottom: 6px; padding: 0; }
.field .hint { color: var(--slate); font-size: 14px; margin: -2px 0 8px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
input[type="text"], input[type="date"], textarea {
  width: 100%; max-width: 60ch;
  font-family: var(--sans); font-size: 16px; color: var(--ink);
  padding: 9px 11px; border: 1px solid var(--slate); border-radius: 4px; background: var(--white);
}
textarea { min-height: 84px; resize: vertical; font-family: var(--serif); line-height: 1.5; }
input[aria-invalid="true"] { border-color: var(--flag); border-width: 2px; }
.field-error { color: var(--flag); font-weight: 700; font-size: 14px; margin: 0 0 6px; }
.error-summary { border: 2px solid var(--flag); background: var(--white); padding: 14px 18px; margin-bottom: 24px; }
.error-summary h2 { margin: 0 0 8px; font-size: 17px; }
.error-summary ul { margin: 0; padding-left: 20px; }
.error-summary a { color: var(--flag); }
.choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
.choice {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 38px; padding: 6px 12px;
  border: 1px solid var(--rule); border-radius: 4px; background: var(--white);
  font-size: 15px; cursor: pointer;
}
.choice:hover { border-color: var(--slate); }
.choice:has(input:checked) { border-color: var(--evidence); background: var(--tint); }
.choice input { width: 18px; height: 18px; margin: 0; accent-color: var(--evidence); flex: 0 0 auto; }
.tag-entry { display: flex; gap: 8px; max-width: 60ch; }
.tag-entry input { flex: 1 1 auto; }
.tags { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
.tags li { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 12px; background: var(--white); border: 1px solid var(--rule); border-radius: 16px; font-size: 15px; }
.tags .btn-link { font-size: 14px; }

/* Readout */
.readout {
  background: var(--white); border: 1px solid var(--rule); border-left: 4px solid var(--evidence);
  padding: 14px 18px; margin: 20px 0 8px;
}
.readout p { margin: 0 0 6px; font-size: 15px; }
.readout p:last-child { margin-bottom: 0; }
.readout .readout-main { font-size: 17px; font-weight: 700; }
.readout .gap { color: var(--flag); font-weight: 700; }

/* Level ladder */
.level { margin-top: 34px; }
.level-title { font-size: 20px; margin: 0 0 4px; }
.level-num { color: var(--slate); font-weight: 400; font-size: 15px; margin-right: 8px; }
.level-desc { font-family: var(--serif); font-size: 16px; line-height: 1.55; margin: 0 0 10px; }
.level-note { color: var(--slate); font-size: 14px; margin: 0 0 10px; }
.level.quiet .level-title { color: var(--slate); }
.level.quiet .level-desc { color: var(--slate); }
.level.quiet .statement legend { color: var(--slate); }
.level.quiet .opt { background: transparent; }
.comp-line {
  margin: 40px 0 0; padding-top: 10px;
  border-top: 2px dashed var(--ink);
  font-size: 14px; color: var(--ink); font-weight: 700;
}
.statement { border-top: 1px solid var(--rule); padding: 16px 0 14px; }
.statement legend { float: left; width: 100%; padding: 0; margin: 0 0 10px; font-family: var(--serif); font-size: 17px; line-height: 1.5; }
.statement legend .st-id { font-family: var(--sans); font-size: 13px; color: var(--slate); margin-left: 8px; white-space: nowrap; }
.statement .opts { clear: both; display: flex; flex-wrap: wrap; gap: 6px; }
.opt {
  display: inline-flex; align-items: center; gap: 7px;
  min-height: 36px; padding: 5px 11px;
  border: 1px solid var(--rule); border-radius: 4px; background: var(--white);
  font-size: 14px; cursor: pointer;
}
.opt:hover { border-color: var(--slate); }
.opt:has(input:checked) { border-color: var(--evidence); background: var(--tint); font-weight: 700; }
.opt input, .doc input { width: 18px; height: 18px; margin: 0; accent-color: var(--evidence); flex: 0 0 auto; }
.st-extra { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; margin-top: 10px; }
.doc { display: inline-flex; align-items: center; gap: 7px; min-height: 32px; font-size: 14px; cursor: pointer; }
.note-wrap { margin-top: 10px; }
.note-wrap label { display: block; font-size: 14px; color: var(--slate); margin-bottom: 4px; }
.note-wrap textarea { min-height: 64px; }

/* Anti-patterns */
.ap { border-top: 1px solid var(--rule); padding: 18px 0; }
.ap h2 { margin: 0 0 4px; font-size: 18px; }
.ap legend { font-family: var(--serif); font-size: 17px; line-height: 1.5; margin-bottom: 10px; padding: 0; }
.ap .linked { color: var(--slate); font-size: 14px; margin: 0 0 8px; }

/* Profile */
.chart-wrap { max-width: 52rem; margin: 20px 0 8px; }
.chart-wrap svg { display: block; width: 100%; height: auto; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 14px; color: var(--ink); margin: 8px 0 12px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 8px; }
.animate .mk { animation: settle 520ms cubic-bezier(.2,.7,.3,1) both; animation-delay: var(--d, 0ms); }
@keyframes settle { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .animate .mk { animation: none; }
  html { scroll-behavior: auto; }
}
table.data { border-collapse: collapse; width: 100%; font-size: 14px; margin: 8px 0 16px; background: var(--white); }
table.data caption { text-align: left; font-weight: 700; padding: 0 0 6px; }
table.data th, table.data td { border: 1px solid var(--rule); padding: 7px 9px; text-align: left; vertical-align: top; }
table.data th { background: #F5F8FB; font-weight: 700; }
.flag-item { border: 1px solid var(--rule); border-left: 4px solid var(--flag); background: var(--white); padding: 12px 16px; margin: 10px 0; }
.flag-item.note-item { border-left-color: var(--slate); }
.flag-label { display: flex; align-items: center; gap: 8px; color: var(--flag); font-weight: 700; font-size: 14px; margin: 0 0 6px; }
.note-item .flag-label { color: var(--slate); }
.flag-item .flag-text { font-family: var(--serif); font-size: 16px; line-height: 1.5; margin: 0 0 10px; }
.flag-status { font-size: 14px; margin: 0 0 8px; }
.flag-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rationale-entry { margin-top: 10px; }
.rationale-entry input { max-width: 100%; }
.plain-list { padding-left: 20px; margin: 8px 0 14px; }
.plain-list li { margin-bottom: 6px; }
.gap-text { color: var(--flag); }
.constraining-box { background: var(--white); border: 1px solid var(--rule); padding: 14px 18px; }
.constraining-box p:last-child { margin-bottom: 0; }

/* Next steps */
.ns-group { border-top: 1px solid var(--rule); padding-top: 6px; margin-top: 26px; }
.ns-group h2 { margin-top: 12px; }
.ns-item { background: var(--white); border: 1px solid var(--rule); padding: 12px 16px; margin: 10px 0; }
.ns-item .ns-action { font-family: var(--serif); font-size: 17px; line-height: 1.5; margin: 0 0 8px; }
.ns-item .ns-id { color: var(--slate); font-size: 13px; }
.ns-fields { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px 14px; align-items: end; margin-top: 8px; }
.ns-fields label.small { display: block; font-size: 13px; color: var(--slate); margin-bottom: 3px; }
.ns-fields input[type="text"] { padding: 6px 9px; font-size: 15px; }
.gap-item { border-left: 3px solid var(--flag); padding: 6px 0 6px 12px; margin: 8px 0; font-family: var(--serif); }
.gap-item .gap-label { font-family: var(--sans); font-size: 14px; color: var(--flag); font-weight: 700; display: block; }

.pager { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--rule); }

/* Report */
.report-toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 24px; }
.report { background: var(--white); border: 1px solid var(--rule); padding: 36px 40px; max-width: 52rem; font-family: var(--serif); font-size: 15px; line-height: 1.55; }
.report h1 { font-family: var(--sans); font-size: 24px; }
.report h2 { font-family: var(--sans); font-size: 18px; margin-top: 28px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; }
.report h3 { font-family: var(--sans); font-size: 15px; }
.report table.data { font-family: var(--sans); font-size: 13px; }
.report .meta-table td:first-child { width: 30%; font-weight: 700; }
.report .footer-block { margin-top: 30px; border-top: 1px solid var(--rule); padding-top: 12px; font-size: 13px; color: var(--slate); }
.report .flag-item { padding: 8px 12px; }
.report .flag-item .flag-text { font-size: 14px; margin-bottom: 4px; }
#print-root { display: none; }

@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .app-header .menu-btn { display: inline-flex; }
  .rail { display: none; }
  .rail.open {
    display: block; position: fixed; z-index: 30; top: var(--header-h); left: 0; bottom: 0;
    width: min(320px, 90vw); overflow-y: auto; background: var(--paper);
    border-right: 1px solid var(--rule); box-shadow: 2px 0 0 rgba(29,43,58,.08);
  }
  main { padding: 24px 24px 80px; }
  .hdr-name { max-width: 20ch; }
}
@media (max-width: 600px) {
  .app-header { padding: 8px 14px; gap: 6px 12px; }
  .tool-title { font-size: 14px; flex: 1 1 60%; }
  .hdr-name { display: none; }
  .hdr-meta { width: 100%; justify-content: space-between; font-size: 13px; }
  .hdr-mode { display: none; }
  main { padding: 20px 16px 72px; }
  h1 { font-size: 24px; }
  .report { padding: 20px 16px; }
  .ns-fields { grid-template-columns: 1fr; }
}

@media print {
  @page { size: A4; margin: 16mm 15mm 16mm; }
  body { background: #fff; font-size: 10pt; }
  body > *:not(#print-root) { display: none !important; }
  #print-root { display: block !important; }
  .report { border: 0; padding: 0; max-width: none; font-size: 10pt; line-height: 1.45; }
  .report h1 { font-size: 18pt; }
  .report h2 { font-size: 12.5pt; margin-top: 16pt; break-after: avoid; page-break-after: avoid; }
  .report h3 { font-size: 11pt; break-after: avoid; page-break-after: avoid; }
  .report p, .report li { orphans: 3; widows: 3; }
  .report table.data { font-size: 8.5pt; }
  .report tr, .report .flag-item, .report .keep { break-inside: avoid; page-break-inside: avoid; }
  .report .chart-wrap { max-width: 175mm; break-inside: avoid; page-break-inside: avoid; }
  .report .mk { animation: none !important; }
  a { color: inherit; text-decoration: none; }
}


/* Agile Health Informatics navigator visual language */
:root {
  --bg: #EDF3F8;
  --surface: #FFFFFF;
  --surface-2: #F5F8FB;
  --surface-3: #DFE9F3;
  --text: #17324A;
  --muted: #5B7187;
  --line: #C7D5E3;
  --brand: #4F7EB1;
  --brand-deep: #3E6897;
  --brand-soft: #7399C0;
  --accent: #DCE8B2;
  --accent-strong: #C9DC93;
  --accent-ink: #4D6220;
  --shadow: 0 12px 30px rgba(42,78,114,.10);
  --radius: 16px;

  /* Map toolkit semantic tokens to the navigator palette */
  --ink: var(--text);
  --paper: var(--bg);
  --rule: var(--line);
  --slate: var(--muted);
  --evidence: var(--brand);
  --flag: #946200;
  --white: var(--surface);
  --tint: #EAF1F8;
  --flag-tint: #FFF4DC;
  --header-h: 76px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;
  line-height: 1.6;
}

:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
a { color: var(--brand-deep); text-underline-offset: .18em; }
a:hover { color: var(--brand); }

.app-header {
  min-height: var(--header-h);
  padding: 9px 22px;
  gap: 14px 18px;
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 4px 18px rgba(42,78,114,.07);
}
.brand-zone { flex: 0 0 auto; }
.brand-link {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 250px;
  color: var(--text);
  text-decoration: none;
  border-radius: 12px;
}
.brand-link:focus-visible { outline-offset: 4px; }
.brand-logo {
  width: 52px;
  height: 52px;
  object-fit: cover;
  border-radius: 12px;
  box-shadow: 0 5px 14px rgba(30,54,82,.15);
}
.brand-name { line-height: 1.08; }
.brand-name strong {
  display: block;
  color: var(--brand-deep);
  font-size: .98rem;
  letter-spacing: -.015em;
}
.brand-name span {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: .69rem;
  letter-spacing: .14em;
  text-transform: lowercase;
}
.tool-identity {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  border-left: 1px solid var(--line);
  padding-left: 18px;
}
.tool-title {
  color: var(--brand-deep);
  font-size: 15px;
  font-weight: 750;
  letter-spacing: -.01em;
}
.hdr-name { color: var(--muted); font-size: 13px; }
.hdr-meta { gap: 12px; color: var(--muted); }
.hdr-confirm { color: var(--brand-deep); }
.guide-link { white-space: nowrap; }

.layout { grid-template-columns: 260px minmax(0, 1fr); }
.rail {
  background: var(--surface-2);
  border-right: 1px solid var(--line);
  padding-top: 24px;
}
.rail button {
  min-height: 40px;
  padding: 8px 20px 8px 19px;
  border-left-width: 4px;
  color: var(--text);
  border-radius: 0 10px 10px 0;
}
.rail button:hover { background: var(--surface-3); color: var(--brand-deep); }
.rail button[aria-current="page"] {
  border-left-color: var(--brand);
  background: var(--surface);
  color: var(--brand-deep);
  box-shadow: 0 3px 12px rgba(42,78,114,.06);
}

main { padding: 42px 52px 96px; }
.screen { max-width: 76ch; }
h1,h2,h3 { color: var(--brand-deep); letter-spacing: -.02em; }
h1 { font-size: clamp(2rem,4vw,2.85rem); line-height: 1.08; margin-bottom: 16px; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.08rem; }
.prose,.prose p,p.prose,.lead,.level-desc,.statement legend,.ap legend,.ns-item .ns-action,.flag-item .flag-text {
  font-family: Georgia,"Times New Roman",serif;
}
.lead { color: var(--muted); font-size: 1.13rem; }
.bookref,.quiet-text,.field .hint,.level-note,.ap .linked,.ns-item .ns-id { color: var(--muted); }

.btn {
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 2px 8px rgba(42,78,114,.04);
}
.btn:hover { border-color: var(--brand); background: var(--surface-2); color: var(--brand-deep); }
.btn-primary {
  background: var(--brand-deep);
  border-color: var(--brand-deep);
  color: #fff;
}
.btn-primary:hover { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn-link { color: var(--brand-deep); }
.btn-link:hover { color: var(--brand); }

.panel,.readout,.constraining-box,.ns-item,.flag-item,.report,.banner,.error-summary {
  border-color: var(--line);
  background: var(--surface);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.panel { padding: 19px 21px; }
.privacy,.readout { border-left: 5px solid var(--brand); }
.banner.notice { border-left-color: var(--brand); }
.banner.error,.flag-item { border-left-color: #946200; }
.readout { background: linear-gradient(135deg,var(--surface),var(--surface-2)); }
.readout .readout-main { color: var(--brand-deep); }
.readout .gap,.gap-text,.gap-item .gap-label { color: #946200; }

input[type="text"],input[type="date"],textarea {
  border-color: var(--line);
  border-radius: 9px;
  background: var(--surface);
  color: var(--text);
}
input[type="text"]:focus,input[type="date"]:focus,textarea:focus { border-color: var(--brand); }
.choice,.opt {
  border-color: var(--line);
  border-radius: 9px;
  background: var(--surface);
}
.choice:hover,.opt:hover { border-color: var(--brand); }
.choice:has(input:checked),.opt:has(input:checked) {
  border-color: var(--brand);
  background: color-mix(in srgb,var(--brand) 10%,var(--surface));
  color: var(--brand-deep);
}
.choice input,.opt input,.doc input { accent-color: var(--brand); }
.tags li { background: var(--surface); border-color: var(--line); }

.level { margin-top: 38px; }
.level-title { color: var(--brand-deep); }
.statement,.ap,.ns-group,.pager { border-color: var(--line); }
.comp-line { border-top-color: var(--brand-deep); color: var(--brand-deep); }

.chart-wrap {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  box-shadow: var(--shadow);
}
table.data { border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(42,78,114,.05); }
table.data th,table.data td { border-color: var(--line); }
table.data th { background: var(--surface-2); color: var(--brand-deep); }
.constraining-box { border-left: 5px solid var(--accent-ink); }
.flag-label { color: #946200; }
.note-item .flag-label { color: var(--muted); }

.report { border-radius: 18px; }
.report h1,.report h2,.report h3 { color: var(--brand-deep); }
.report h2 { border-bottom-color: var(--line); }
.report .footer-block { border-top-color: var(--line); }

/* Give the Start screen a navigator-style branded opening card without changing its content. */
#screen > .screen:first-child > h1:first-child {
  margin-top: 2px;
}
body:not(.printing) #screen > .screen:first-child > h1:first-child::after {
  content: "";
  display: block;
  width: 78px;
  height: 5px;
  margin-top: 15px;
  border-radius: 999px;
  background: linear-gradient(90deg,var(--accent-strong),var(--brand-soft));
}

@media (max-width: 1050px) {
  .brand-name span { display: none; }
  .brand-link { min-width: 0; }
  .tool-identity { padding-left: 12px; }
  .hdr-mode { display: none; }
}
@media (max-width: 900px) {
  :root { --header-h: 72px; }
  .app-header { padding: 8px 14px; }
  .app-header .menu-btn { display: inline-flex; order: 4; }
  .tool-identity { flex: 1 1 280px; }
  .hdr-meta { margin-left: auto; }
  .rail.open { background: var(--surface-2); top: var(--header-h); box-shadow: 8px 0 26px rgba(42,78,114,.16); }
  main { padding: 30px 24px 80px; }
}
@media (max-width: 680px) {
  :root { --header-h: 68px; }
  .brand-logo { width: 46px; height: 46px; }
  .brand-name strong { font-size: .9rem; }
  .tool-identity { display: none; }
  .hdr-meta { width: auto; }
  .hdr-save,.hdr-mode { display: none; }
  .app-header .menu-btn { order: initial; }
  main { padding: 24px 16px 72px; }
  h1 { font-size: clamp(1.8rem,9vw,2.4rem); }
}
@media (max-width: 460px) {
  .brand-name { display: none; }
  .brand-link { min-width: auto; }
  .hdr-confirm { display: none; }
}

@media print {
  .panel,.readout,.constraining-box,.ns-item,.flag-item,.report,.banner,.error-summary,.chart-wrap,table.data { box-shadow: none !important; }
  .report { border-radius: 0; }
}

</style>

{
  "modelName": "Health Data Operability Maturity Model",

  "modelHistory": [],
  "levels": [
    { "n": 1, "name": "Reactive", "threshold": null,
      "descriptor": "Operability is addressed only when something fails, and the knowledge needed to interpret data resides in individuals rather than in any durable record." },
    { "n": 2, "name": "Aware", "threshold": "inplace",
      "descriptor": "Operability is recognised as a distinct concern and problems are named accurately, but understanding has not yet become practice." },
    { "n": 3, "name": "Defined", "threshold": "inplace",
      "descriptor": "Practices are documented, repeatable and applied consistently for priority data, but coverage is partial, strong where attention has been paid and absent elsewhere." },
    { "n": 4, "name": "Sustained", "threshold": "holds",
      "descriptor": "Operability is measured and maintained across the lifecycle, no longer depends on particular individuals, and meaning is recoverable by machines as well as by people." },
    { "n": 5, "name": "Anticipatory", "threshold": "holds",
      "descriptor": "Operability is protected by design rather than recovered by effort, governance takes forms systems can act on, and the organisation contributes to shared meaning beyond its own boundaries." }
  ],
  "responseScale": [
    { "id": "not", "label": "Not in place", "meaning": "This does not happen, or happens only by chance" },
    { "id": "partly", "label": "Partly", "meaning": "This happens in some areas or some of the time" },
    { "id": "inplace", "label": "In place", "meaning": "This happens consistently under normal conditions" },
    { "id": "holds", "label": "Holds under pressure", "meaning": "This has continued through at least one system change, staff turnover, or a delivery deadline" },
    { "id": "unknown", "label": "Not known", "meaning": "Nobody present can say" }
  ],
  "antiPatternScale": [
    { "id": "none", "label": "Not observed" },

    { "id": "unknown", "label": "Not known" }
  ],
  "dimensions": [
    {
      "id": "SG", "name": "Semantic governance",
      "description": "Managing meaning consistently, including how local usage relates to recognised terminologies and classifications.",
      "definitionSource": "Interpretable; operational semantics",
      "bookReference": "Chapters 3 and 7",
      "dependsOn": [ { "id": "AS", "reason": "Shared meaning depends on someone being accountable for it" } ],
      "constrainingText": "Preservation and assurance both rely on consistent meaning. Where semantic governance lags, data can be moved and kept faithfully and still be read differently by each team that receives it.",
      "levels": {
        "1": { "descriptor": "The same concept is recorded differently across systems, and nobody reconciles the difference." },
        "2": { "descriptor": "Divergence is recognised and named, but not systematically reconciled.", "statements": [
          { "id": "SG-2-1", "text": "We can name the priority data elements whose meaning is known to differ between systems or teams.", "action": "Name the priority data elements whose meaning is known to differ between systems or teams." },
          { "id": "SG-2-2", "text": "Someone is recognised as responsible for raising and tracking semantic divergence, even if resolution is informal.", "action": "Make someone responsible for raising and tracking semantic divergence." } ] },
        "3": { "descriptor": "Shared definitions exist for priority data, and local usage is mapped to recognised standards.", "statements": [
          { "id": "SG-3-1", "text": "Priority data elements have written definitions that are used when systems are configured or changed.", "action": "Write and adopt definitions for priority data elements, and use them whenever systems are configured or changed." },
          { "id": "SG-3-2", "text": "Local codes and value sets for priority data are mapped to recognised terminologies or classifications, and the mappings are maintained.", "action": "Map local codes and value sets for priority data to recognised terminologies or classifications, and maintain the mappings." } ] },
        "4": { "descriptor": "Definitions are maintained as a living resource, and drift is detected by monitoring rather than by incident.", "statements": [
          { "id": "SG-4-1", "text": "Changes to definitions, value sets and mappings are versioned, so the meaning of historic data can be reconstructed.", "action": "Version changes to definitions, value sets and mappings, so that the meaning of historic data can be reconstructed.", "computability": true },
          { "id": "SG-4-2", "text": "Semantic drift in priority data is detected through routine checks that do not depend on a particular person noticing.", "action": "Introduce routine checks that detect semantic drift in priority data without relying on a particular person noticing." } ] },
        "5": { "descriptor": "Divergence is resolved before deployment, and definitions are machine-readable and shared beyond the organisation.", "statements": [
          { "id": "SG-5-1", "text": "New systems and configuration changes are assessed for semantic impact before go-live, as a condition of approval.", "action": "Make assessment of semantic impact a condition of approval for new systems and configuration changes." },
          { "id": "SG-5-2", "text": "Definitions and mappings are published in machine-readable form and shared with, or contributed to, partner organisations or the wider community.", "action": "Publish definitions and mappings in machine-readable form, and share them with partner organisations or the wider community.", "computability": true } ] }
      }
    },
    {
      "id": "CC", "name": "Context capture",
      "description": "Capturing the provenance, method, intent and constraints that make data interpretable.",
      "definitionSource": "Interpretable, trustworthy; the four context categories",
      "bookReference": "Chapters 7 and 9",
      "dependsOn": [],
      "constrainingText": "Every other dimension relies on context. Preservation without context preserves data that can no longer be understood.",
      "levels": {
        "1": { "descriptor": "Context lives in the heads of the people present when data was created." },
        "2": { "descriptor": "Some context is captured, inconsistently, and the gaps are acknowledged.", "statements": [
          { "id": "CC-2-1", "text": "We know which priority data items routinely lose their provenance, method, intent or constraints.", "action": "Identify which priority data items routinely lose their provenance, method, intent or constraints." },
          { "id": "CC-2-2", "text": "For priority data, at least some systems record who created it, in what role, and when.", "action": "Ensure that at least some systems record who created priority data, in what role, and when." } ] },
        "3": { "descriptor": "All four context categories are captured systematically for priority data and treated as part of the data.", "statements": [
          { "id": "CC-3-1", "text": "For priority data, provenance and method are captured at or near the point of creation as structured information rather than free text.", "action": "Capture provenance and method for priority data as structured information at or near the point of creation." },
          { "id": "CC-3-2", "text": "Intent and known constraints on use are recorded for priority data. Intent covers distinctions such as acute versus long-term, or working versus confirmed.", "action": "Record intent and known constraints on use for priority data, including distinctions such as acute versus long-term, or working versus confirmed." } ] },
        "4": { "descriptor": "Context travels with data as a condition of its movement, and lineage is recorded through transformations.", "statements": [
          { "id": "CC-4-1", "text": "When priority data is transformed, merged or moved between systems, its provenance and lineage are preserved and can be traced.", "action": "Preserve provenance and lineage whenever priority data is transformed, merged or moved between systems.", "computability": true },
          { "id": "CC-4-2", "text": "Data flows that strip context are identified and treated as defects, not accepted as limitations.", "action": "Identify data flows that strip context, and treat them as defects to be fixed rather than limitations to be accepted." } ] },
        "5": { "descriptor": "Context is complete enough for meaning to be reconstructed computationally, and provenance is treated as evidence.", "statements": [
          { "id": "CC-5-1", "text": "The context attached to priority data is sufficient for an automated system to interpret it without a person supplying what was left unsaid.", "action": "Make the context attached to priority data complete enough for an automated system to interpret it without a person supplying what was left unsaid.", "computability": true },
          { "id": "CC-5-2", "text": "Context requirements for new capture points are specified before build, not added afterwards.", "action": "Specify context requirements for new capture points before they are built." } ] }
      }
    },
    {
      "id": "PA", "name": "Process awareness",
      "description": "Preserving the workflow context that gives data its operational meaning.",
      "definitionSource": "Operationally actionable",
      "bookReference": "Chapter 8",
      "dependsOn": [ { "id": "CC", "reason": "Process context is itself a kind of context" } ],
      "constrainingText": "Process awareness supplies the workflow context that turns information into something a team can act on. Where it lags, data arrives intact but staff must reconstruct what happened, usually by telephone.",
      "levels": {
        "1": { "descriptor": "Meaning is assumed to be intrinsic to data structure, and the workflow that produced it is ignored." },
        "2": { "descriptor": "The loss of process context is acknowledged, especially at handovers.", "statements": [
          { "id": "PA-2-1", "text": "We can identify the handovers, such as discharge, referral or medication change, where workflow context is lost.", "action": "Identify the handovers, such as discharge, referral or medication change, where workflow context is lost." },
          { "id": "PA-2-2", "text": "Clinical and operational staff are involved when data requirements are specified, not only technical teams.", "action": "Involve clinical and operational staff, not only technical teams, whenever data requirements are specified." } ] },
        "3": { "descriptor": "Key workflows are documented as they actually run, and process context is recorded for priority data.", "statements": [
          { "id": "PA-3-1", "text": "The workflows that produce priority data are documented as they actually operate, including known workarounds.", "action": "Document the workflows that produce priority data as they actually operate, including known workarounds." },
          { "id": "PA-3-2", "text": "Priority data records the process step, care setting or pathway point at which it was created.", "action": "Record the process step, care setting or pathway point at which priority data is created." } ] },
        "4": { "descriptor": "Process models are maintained as information and kept current with practice.", "statements": [
          { "id": "PA-4-1", "text": "Process models are updated when practice changes, and discrepancies between model and practice are tracked.", "action": "Update process models when practice changes, and track discrepancies between model and practice." },
          { "id": "PA-4-2", "text": "Coordination across teams relies on shared, recorded process context rather than on telephone calls to reconstruct it.", "action": "Base coordination across teams on shared, recorded process context rather than on telephone calls to reconstruct it.", "computability": true } ] },
        "5": { "descriptor": "Process models are first-class information, shared across organisations and used to design systems.", "statements": [
          { "id": "PA-5-1", "text": "System changes are assessed against process models before implementation, so their workflow impact is known in advance.", "action": "Assess system changes against process models before implementation, so that their workflow impact is known in advance." },
          { "id": "PA-5-2", "text": "Process context for shared pathways is agreed and exchanged with partner organisations.", "action": "Agree and exchange process context for shared pathways with partner organisations.", "computability": true } ] }
      }
    },
    {
      "id": "AS", "name": "Accountability and stewardship",
      "description": "Making responsibility, rules of use, and handling explicit rather than assumed.",
      "definitionSource": "Governable",
      "bookReference": "Chapters 9 and 15",
      "dependsOn": [ { "id": "CC", "reason": "Stewardship depends on knowing where data came from and how it may be used" } ],
      "constrainingText": "Stewardship decides who keeps meaning intact when things change. Where accountability is assumed rather than explicit, good practice elsewhere depends on committed individuals and tends to lapse when they move on.",
      "levels": {
        "1": { "descriptor": "Nobody clearly owns the data, and governance happens after problems arise." },
        "2": { "descriptor": "The need for ownership is recognised, but stewardship depends on committed individuals.", "statements": [
          { "id": "AS-2-1", "text": "Most priority data domains have someone who is informally regarded as their owner or steward.", "action": "Identify someone, even informally, as owner or steward for each priority data domain." },
          { "id": "AS-2-2", "text": "The organisation acknowledges where governance decisions have been made after deployment rather than before.", "action": "Acknowledge openly where governance decisions have been made after deployment rather than before." } ] },

      "constrainingText": "Lifecycle continuity decides whether today's meaning survives tomorrow's system change. Where it lags, strengths in every other dimension are at risk at the next migration or retirement.",

  "text": {
    "startParagraphs": [
      "This assessment helps a team see where it currently stands in keeping health data meaningful, and recognise what the next step would involve. It looks at six dimensions, from how meaning is governed and how context is captured, through to whether data stays intelligible across system change and can be shown to be fit for the uses it is put to.",
      "It asks whether meaning survives, not how much has been digitised. A service can run modern systems and still lose the context that makes its information safe to act on, while a service with older systems may keep that context well. The questions therefore ask how meaning is created, governed, preserved and reused, and never which systems you run.",
      "It is not a certification, a benchmark or a way of ranking organisations. The result is a profile across the six dimensions and a set of next steps. Throughout, it separates what is documented from what is practised, because the gap between the two is often the most useful thing an assessment reveals."

    "cautions": [
      { "title": "Navigation, not judgement.", "text": "The assessment charts a course from a known position, and an honest finding of low maturity is more valuable than an inflated one because it points to the work that matters." },

    "workshopLater": "Workshop mode, where several participants answer independently and a facilitator records a consensus, will arrive in the next version of this toolkit. Until then, a facilitator can lead the discussion and record the group's agreed answers as a single assessment.",

    "priorityDataHelp": "Several statements refer to priority data, and the Defined level is judged only within this scope, so an assessment is meaningful only against a named set of data.",
    "scaleIntro": "Each statement is answered against the same five responses. Answer from what actually happens, not from what policy says should happen.",
    "documentedExplanation": "Separately, tick Documented if a policy, standard or procedure says this should happen, whether or not it does. The toolkit uses these ticks to work out a claimed level, and sets it beside the evidenced level, which comes only from what happens in practice.",
    "cumulativeExplanation": "Levels are cumulative. A level counts only when every level below it holds in practice. Strong practice at a higher level is still worth recording, and it will count once the levels beneath it are in place.",

    "implicationsNone": "Every dimension is evidenced at Sustained or above. Automated uses should still have their fitness checked before they begin.",
    "nextStepsIntro": "Next steps come from the statements not yet in place at the level above where each dimension stands. The constraining dimension comes first. Mark the steps the team agrees to prioritise.",
    "topLevelReached": "This dimension is evidenced at Anticipatory, the highest level. The next step is to keep these practices holding through each change.",

      "cumulative": "{higher} practice is recorded, but it will not count until {next} criteria hold.",
      "levelAnnounce": "Evidenced level now {level}",
      "confidenceSuggested": "Suggested as low because a statement in this dimension is marked Not known. You can change it.",
      "dependency": "{dependent} is evidenced at {level}, {gap} levels above {dependency}. {reason}, so check whether the higher level is sustained in practice.",
      "apRecurring": "{antiPattern} is marked as recurring, while {dimensions}. Practice at that level should make this rare, so check whether the responses reflect recent experience.",

}

/* ---------- model: parse, validate, index ---------- */

var ModelMod = {
  parse: function (text) {

  practiceAhead: function (m, dimId, resp, ev) {
    for (var n = 5; n >= ev + 2; n--) {
      if (Levels.statementsAt(m, dimId, n).some(function (s) { return Levels.meetsAt(m, n, resp[s.id]); })) return n;
    }
    return null;
  },
  unknownCount: function (m, dimId, resp) {
    var c = 0;
    for (var n = 2; n <= 5; n++) Levels.statementsAt(m, dimId, n).forEach(function (s) { if (resp[s.id] && resp[s.id].practice === 'unknown') c++; });
    return c;
  },
  completion: function (m, dimId, resp) {
    var total = 0, answered = 0;
    for (var n = 2; n <= 5; n++) Levels.statementsAt(m, dimId, n).forEach(function (s) {
      total++;
      if (resp[s.id] && resp[s.id].practice) answered++;
    });
    return answered === 0 ? 'none' : (answered === total ? 'complete' : 'partial');
  },
  profile: function (m, resp) {
    var p = {};
    m.dimensions.forEach(function (d) { p[d.id] = { ev: Levels.evidenced(m, d.id, resp), cl: Levels.claimed(m, d.id, resp) }; });
    return p;
  },
  suggestedConfidence: function (m, dimId, resp) { return Levels.unknownCount(m, dimId, resp) > 0 ? 'low' : 'medium'; }
};

/* ---------- flags: dependency, anti-pattern tension, unknown (pure) ---------- */

var Flags = {
  dependency: function (m, prof) {
    var t = m.text.templates, out = [];
    m.dimensions.forEach(function (d) {
      d.dependsOn.forEach(function (x) {
        var a = prof[d.id].ev, b = prof[x.id].ev;
        if (a - b >= 2) {
          out.push({
            id: 'dep-' + d.id + '-' + x.id, kind: 'dependency', dims: [d.id, x.id],
            text: fill(t.dependency, { dependent: d.name, level: ModelMod.levelName(m, a), gap: NUM_WORDS[a - b] || String(a - b), dependency: m.idx.dimById[x.id].name, reason: x.reason })
          });
        }
      });
    });
    return out;
  },
  antiPattern: function (m, prof, apResp) {
    var t = m.text.templates, out = [];
    m.antiPatterns.forEach(function (ap) {
      var r = apResp[ap.id] && apResp[ap.id].response;
      var min = r === 'recurring' ? 3 : (r === 'once' ? 4 : 0);
      if (!min) return;
      var hit = ap.linked.filter(function (id) { return prof[id].ev >= min; });
      if (!hit.length) return;
      var phrase = listJoin(hit.map(function (id) { return m.idx.dimById[id].name + ' is evidenced at ' + ModelMod.levelName(m, prof[id].ev); }));
      out.push({
        id: 'ap-' + ap.id, kind: 'antipattern', dims: hit, ap: ap.id,
        text: fill(r === 'recurring' ? t.apRecurring : t.apOnce, { antiPattern: ap.name, dimensions: phrase })
      });
    });
    return out;
  },
  unknownNotes: function (m, apResp) {
    var t = m.text.templates, out = [];
    m.antiPatterns.forEach(function (ap) {
      if (!(apResp[ap.id] && apResp[ap.id].response === 'unknown')) return;
      out.push({
        id: 'apu-' + ap.id, kind: 'unknown', dims: ap.linked.slice(), ap: ap.id,
        text: fill(t.apUnknown, { antiPattern: ap.name.charAt(0).toLowerCase() + ap.name.slice(1), dimensions: listJoin(ap.linked.map(function (id) { return m.idx.dimById[id].name; })) })
      });
    });
    return out;
  },
  all: function (m, prof, apResp) { return Flags.dependency(m, prof).concat(Flags.antiPattern(m, prof, apResp)); }
};

/* ---------- constraining dimension (pure) ---------- */

function constrainingOf(m, prof) {
  var rows = m.dimensions.map(function (d, i) { return { id: d.id, ev: prof[d.id].ev, deps: m.idx.dependents[d.id], i: i }; });
  rows.sort(function (a, b) { return a.ev - b.ev || b.deps - a.deps || a.i - b.i; });
  var first = rows[0];
  return { id: first.id, ties: rows.filter(function (r) { return r.id !== first.id && r.ev === first.ev; }).map(function (r) { return r.id; }) };
}

/* ---------- next steps (pure) ---------- */

var NextSteps = {
  derive: function (m, resp, prof, constrainingId) {
    var groups = m.dimensions.map(function (d, i) {
      var ev = prof[d.id].ev, cl = prof[d.id].cl, next = [], gaps = [];
      if (ev < 5) {
        Levels.statementsAt(m, d.id, ev + 1).forEach(function (s) {
          if (!Levels.meetsAt(m, ev + 1, resp[s.id])) next.push(m.idx.statementById[s.id]);
        });
      }
      for (var n = 2; n <= cl; n++) {
        Levels.statementsAt(m, d.id, n).forEach(function (s) {
          var e = resp[s.id];
          if (e && e.documented === true && !(e.practice === 'inplace' || e.practice === 'holds')) gaps.push(m.idx.statementById[s.id]);
        });
      }
      return { dim: d.id, name: d.name, ev: ev, cl: cl, next: next, gaps: gaps, i: i, constraining: d.id === constrainingId };
    });
    groups.sort(function (a, b) {
      if (a.constraining !== b.constraining) return a.constraining ? -1 : 1;
      return a.ev - b.ev || a.i - b.i;
    });
    return groups;
  }
};

/* ---------- store: autosave, export, import, validation ---------- */

var Store = {
  testAvailable: function () {
    try {
      var k = 'hdomm:probe';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  },
  save: function (state) {
    try {
      window.localStorage.setItem(STORAGE_PREFIX + state.id, JSON.stringify(state));
      window.localStorage.setItem(LAST_KEY, state.id);
      return true;
    } catch (e) { return false; }
  },
  load: function (id) {
    try { var raw = window.localStorage.getItem(STORAGE_PREFIX + id); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  },
  lastId: function () { try { return window.localStorage.getItem(LAST_KEY); } catch (e) { return null; } },
  remove: function (id) {
    try {
      window.localStorage.removeItem(STORAGE_PREFIX + id);
      if (Store.lastId() === id) window.localStorage.removeItem(LAST_KEY);
      return true;
    } catch (e) { return false; }
  },
  list: function () {
    var out = [];
    try {
      for (var i = 0; i < window.localStorage.length; i++) {
        var k = window.localStorage.key(i);
        if (k && k.indexOf(STORAGE_PREFIX) === 0) {
          try {
            var s = JSON.parse(window.localStorage.getItem(k));
            if (s && s.schema === SCHEMA) out.push({ id: s.id, title: (s.scope && s.scope.title) || 'Untitled assessment', organisation: (s.scope && s.scope.organisation) || '', updatedAt: s.updatedAt || '' });
          } catch (e) { /* skip unreadable entry */ }
        }
      }
    } catch (e) { return []; }
    out.sort(function (a, b) { return a.updatedAt < b.updatedAt ? 1 : -1; });
    return out;
  },

  /* Validate an imported object. Returns { ok, state, notice } or { ok: false, reason }. Never partial. */
  validate: function (obj, m) {
    function no(reason) { return { ok: false, reason: reason }; }
    function str(x) { return typeof x === 'string'; }
    if (!isObj(obj)) return no('This file does not contain an assessment.');
    if (obj.schema !== SCHEMA) return no('This file is not an assessment exported from this toolkit.');
    if (!str(obj.schemaVersion) || obj.schemaVersion.split('.')[0] !== SCHEMA_VERSION.split('.')[0]) return no('This file uses an assessment format this toolkit cannot read, so open it in a matching copy of the toolkit.');
    if (!str(obj.modelVersion)) return no('This file does not say which version of the model it was made with.');
    if (cmpVersion(obj.modelVersion, m.modelVersion) > 0) return no('This file was made with a newer version of the model (' + obj.modelVersion + ') than this toolkit holds (' + m.modelVersion + '), so open it in a newer copy of the toolkit.');
    if (obj.mode === 'workshop' || obj.mode === 'partnership') return no('This file was made in ' + obj.mode + ' mode, which this version of the toolkit does not support yet.');
    if (obj.mode !== 'individual') return no('This file does not say which mode it was made in.');
    if (!str(obj.id) || !obj.id) return no('This file has no assessment identifier.');
    if (!str(obj.createdAt) || !str(obj.updatedAt)) return no('This file is missing its creation or update dates.');
    var sc = obj.scope;
    if (!isObj(sc)) return no('This file has no scope section.');
    var scopeFields = ['title', 'unit', 'organisation', 'date', 'facilitator', 'notes'];
    for (var i = 0; i < scopeFields.length; i++) if (sc[scopeFields[i]] != null && !str(sc[scopeFields[i]])) return no('The scope field "' + scopeFields[i] + '" is not text.');
    if (sc.unit && ['organisation', 'service', 'domain', 'partnership'].indexOf(sc.unit) < 0) return no('The unit of assessment in this file is not recognised.');
    if (!Array.isArray(sc.priorityData) || !sc.priorityData.every(str) || sc.priorityData.length > 8) return no('The priority data list in this file is not in a recognised form.');
    if (!Array.isArray(obj.participants) || obj.participants.length < 1 || !obj.participants.every(function (p) { return isObj(p) && str(p.id); })) return no('This file has no participant record.');
    if (!isObj(obj.responses)) return no('This file has no responses section.');
    var stale = !!cmpVersion(obj.modelVersion, m.modelVersion);
    var dropped = [];
    for (var pid in obj.responses) {
      if (!isObj(obj.responses[pid])) return no('The responses for participant ' + pid + ' are not in a recognised form.');
      for (var sid in obj.responses[pid]) {
        var e = obj.responses[pid][sid];
        if (!isObj(e) || PRACTICE_VALUES.indexOf(e.practice == null ? '' : e.practice) < 0 || (e.documented != null && typeof e.documented !== 'boolean') || (e.note != null && !str(e.note))) {
          return no('The response to statement ' + sid + ' is not in a recognised form.');
        }
        if (!m.idx.statementById[sid]) {
          if (!stale) return no('This file refers to statement ' + sid + ', which does not exist in this version of the model.');
          dropped.push(sid);
        }
      }
    }
    var sections = ['consensus', 'dimensionNotes', 'antiPatterns', 'flagResolutions', 'nextSteps'];
    for (var j = 0; j < sections.length; j++) if (obj[sections[j]] != null && !isObj(obj[sections[j]])) return no('The ' + sections[j] + ' section of this file is not in a recognised form.');
    if (isObj(obj.antiPatterns)) {
      for (var ak in obj.antiPatterns) {
        var ar = obj.antiPatterns[ak];
        if (!isObj(ar) || AP_VALUES.indexOf(ar.response == null ? '' : ar.response) < 0) return no('The anti-pattern response ' + ak + ' is not in a recognised form.');
      }
    }
    if (isObj(obj.dimensionNotes)) {
      for (var dk in obj.dimensionNotes) {
        var dn = obj.dimensionNotes[dk];
        if (!isObj(dn) || (dn.confidence && ['low', 'medium', 'high'].indexOf(dn.confidence) < 0)) return no('The notes for dimension ' + dk + ' are not in a recognised form.');
      }
    }
    if (isObj(obj.flagResolutions)) {
      for (var fk in obj.flagResolutions) {
        var fr = obj.flagResolutions[fk];
        if (!isObj(fr) || ['revisited', 'stands'].indexOf(fr.status) < 0) return no('The flag resolution ' + fk + ' is not in a recognised form.');
      }
    }
    var state = clone(obj);
    var notice = null;
    if (stale) {
      var changed = [];
      (m.modelHistory || []).forEach(function (h) {
        if (cmpVersion(h.version, obj.modelVersion) > 0) (h.changedStatements || []).forEach(function (id) { if (changed.indexOf(id) < 0) changed.push(id); });
      });
      for (var p2 in state.responses) dropped.forEach(function (id) { delete state.responses[p2][id]; });
      dropped.forEach(function (id) { if (state.nextSteps) delete state.nextSteps[id]; });
      notice = { from: obj.modelVersion, to: m.modelVersion, changed: changed, dropped: dropped.filter(function (v, k, a) { return a.indexOf(v) === k; }) };
      state.modelVersion = m.modelVersion;
    }
    return { ok: true, state: state, notice: notice };
  },

  toCSV: function (state, m, resp) {
    function cell(v) { var s = String(v == null ? '' : v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
    var rows = [['Dimension', 'Level', 'Statement ID', 'Statement text', 'Practice response', 'Documented', 'Note']];
    m.dimensions.forEach(function (d) {
      for (var n = 2; n <= 5; n++) {
        Levels.statementsAt(m, d.id, n).forEach(function (s) {
          var e = resp[s.id] || {};
          rows.push([d.name, ModelMod.levelName(m, n), s.id, s.text, ModelMod.responseLabel(m, e.practice), e.documented ? 'Yes' : 'No', e.note || '']);
        });
      }
    });
    return '\uFEFF' + rows.map(function (r) { return r.map(cell).join(','); }).join('\r\n') + '\r\n';
  },

  download: function (filename, text, mime) {
    var blob = new Blob([text], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }
};

/* ---------- chart: profile SVG and its text equivalent ---------- */

var Chart = {
  wrap: function (name, max) {
    var words = name.split(' '), lines = [], cur = '';
    words.forEach(function (w) {
      if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim();
    });
    if (cur) lines.push(cur);
    return lines;
  },
  svg: function (m, rows, opts) {

    var headH = 38;
    var rowH = compact ? 78 : 66;
    var markY = compact ? 46 : 33;
    var footH = compact ? 58 : 44;

    o.push('<title id="pc-title">Operability profile</title>');
    o.push('<desc id="pc-desc">Evidenced and claimed level for each dimension. The table after the chart gives the same information.</desc>');
    rows.forEach(function (r, i) {
      if (r.constraining) o.push('<rect x="0" y="' + (headH + i * rowH) + '" width="' + W + '" height="' + rowH + '" fill="#C7D5E3" fill-opacity="0.45"/>');
    });
    for (var n = 1; n <= 5; n++) {
      o.push('<text x="' + cx(n).toFixed(1) + '" y="24" text-anchor="middle" font-size="' + fsHead + '" font-weight="700" fill="#17324A">' + esc(ModelMod.levelName(m, n)) + '</text>');
    }
    o.push('<line x1="0" y1="' + (headH - 4) + '" x2="' + W + '" y2="' + (headH - 4) + '" stroke="#17324A" stroke-width="1"/>');
    for (var b = 1; b < 5; b++) {
      if (b === 3) continue;
      var bx = labelW + colW * b;
      o.push('<line x1="' + bx.toFixed(1) + '" y1="' + headH + '" x2="' + bx.toFixed(1) + '" y2="' + (headH + rows.length * rowH) + '" stroke="#C7D5E3" stroke-width="1"/>');
    }
    var lineBottom0 = headH + rows.length * rowH + 8;
    o.push('<line x1="' + compX.toFixed(1) + '" y1="' + (headH - 12) + '" x2="' + compX.toFixed(1) + '" y2="' + lineBottom0 + '" stroke="#17324A" stroke-width="1.75" stroke-dasharray="6 5"/>');
    rows.forEach(function (r, i) {
      var top = headH + i * rowH, y = top + markY;
      o.push('<line x1="0" y1="' + (top + rowH) + '" x2="' + W + '" y2="' + (top + rowH) + '" stroke="#C7D5E3" stroke-width="1"/>');
      if (compact) {
        o.push('<text x="2" y="' + (top + 18) + '" font-size="' + fsName + '" font-weight="700" fill="#17324A">' + esc(r.name) + '</text>');
        if (r.constraining) o.push('<text x="' + (W - 2) + '" y="' + (top + 18) + '" text-anchor="end" font-size="' + fsSmall + '" fill="#17324A">Constraining</text>');
      } else {
        var lines = Chart.wrap(r.name, 24);
        var baseY = top + (lines.length > 1 ? 22 : 28) - (r.constraining ? 6 : 0);
        lines.forEach(function (ln, k) {
          o.push('<text x="0" y="' + (baseY + k * 17) + '" font-size="' + fsName + '" font-weight="700" fill="#17324A">' + esc(ln) + '</text>');
        });
        if (r.constraining) o.push('<text x="0" y="' + (baseY + lines.length * 17) + '" font-size="' + fsSmall + '" fill="#17324A">Constraining dimension</text>');
      }
      for (var n2 = 1; n2 <= 5; n2++) if (n2 < Math.min(r.ev, r.cl) || n2 > Math.max(r.ev, r.cl)) o.push('<circle cx="' + cx(n2).toFixed(1) + '" cy="' + y + '" r="2.5" fill="#5B7187" fill-opacity="0.5"/>');
      o.push('<g class="mk" style="--d:' + (i * 70) + 'ms">');
      if (r.cl !== r.ev) {
        var x1 = cx(r.ev), x2 = cx(r.cl), dir = x2 > x1 ? 1 : -1;
        var gap = Math.abs(r.cl - r.ev);

        o.push('<line x1="' + sx.toFixed(1) + '" y1="' + y + '" x2="' + ex.toFixed(1) + '" y2="' + y + '" stroke="' + (positive ? '#9A5F0E' : '#5B7187') + '" stroke-width="2"' + (positive ? '' : ' stroke-dasharray="4 3"') + '/>');
        var lx = (x1 + x2) / 2, ly = compact ? y + 25 : y - 17;

        o.push('<text x="' + lx.toFixed(1) + '" y="' + ly + '" text-anchor="middle" font-size="' + fsSmall + '" font-weight="700" stroke="' + (r.constraining ? '#DFE9F3' : '#EDF3F8') + '" stroke-width="5" stroke-linejoin="round" paint-order="stroke" fill="' + (positive ? '#9A5F0E' : '#5B7187') + '">' + label + '</text>');
      }

      o.push('<circle cx="' + cx(r.ev).toFixed(1) + '" cy="' + y + '" r="8" fill="#4F7EB1"/>');

    });
    var lineBottom = headH + rows.length * rowH + 8;

      o.push('<text x="' + (compX + 8).toFixed(1) + '" y="' + capY + '" font-size="' + fsSmall + '" fill="#17324A"><tspan x="' + (compX + 8).toFixed(1) + '">Meaning recoverable</tspan><tspan x="' + (compX + 8).toFixed(1) + '" dy="13">by machines</tspan></text>');
    } else {
      o.push('<text x="' + (compX - 10).toFixed(1) + '" y="' + capY + '" text-anchor="end" font-size="13" fill="#17324A">' + esc(m.text.chartCaptionLeft) + '</text>');

    return o.join('');
  },
  legend: function () {
    return '<div class="chart-legend" aria-hidden="true">' +
      '<span><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="#4F7EB1"/></svg>Evidenced level</span>' +
      '<span><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#4F7EB1" stroke-width="2.5"/></svg>Claimed level</span>' +

      '<span><svg width="28" height="12" viewBox="0 0 28 12"><line x1="0" y1="6" x2="28" y2="6" stroke="#5B7187" stroke-width="2" stroke-dasharray="4 3"/></svg>Practised, not yet documented</span>' +
      '<span><svg width="12" height="24" viewBox="0 0 12 24"><line x1="6" y1="0" x2="6" y2="24" stroke="#17324A" stroke-width="1.75" stroke-dasharray="5 4"/></svg>Computability line</span>' +

  },
  table: function (m, rows) {

    rows.forEach(function (r) {

function newAssessment() {

  return {
    schema: SCHEMA, schemaVersion: SCHEMA_VERSION, modelVersion: MODEL.modelVersion, toolVersion: TOOL_VERSION,
    id: uuid(), createdAt: t, updatedAt: t, mode: 'individual',
    scope: { title: '', unit: '', organisation: '', priorityData: [], date: todayISO(), facilitator: '', notes: '' },
    participants: [{ id: 'p1', label: '', role: '' }],
    responses: { p1: {} },
    consensus: {},
    dimensionNotes: notes,
    antiPatterns: {},
    flagResolutions: {},
    nextSteps: {},
    partnership: { organisations: [], handovers: [] }
  };
}

/* Fill any missing sections and keep suggested confidence in step with the responses. */
function normalise(s) {
  if (!isObj(s.responses)) s.responses = {};
  if (!Array.isArray(s.participants) || !s.participants.length) s.participants = [{ id: 'p1', label: '', role: '' }];
  if (!isObj(s.responses[s.participants[0].id])) s.responses[s.participants[0].id] = {};
  ['consensus', 'antiPatterns', 'flagResolutions', 'nextSteps'].forEach(function (k) { if (!isObj(s[k])) s[k] = {}; });
  if (!isObj(s.dimensionNotes)) s.dimensionNotes = {};
  if (!isObj(s.partnership)) s.partnership = { organisations: [], handovers: [] };
  var resp = respOf(s);
  MODEL.dimensions.forEach(function (d) {
    var n = s.dimensionNotes[d.id];
    if (!isObj(n)) n = s.dimensionNotes[d.id] = { confidence: 'medium', confidenceSource: 'suggested', evidence: '', notes: '' };
    if (n.evidence == null) n.evidence = '';
    if (n.notes == null) n.notes = '';
    if (n.confidenceSource !== 'chosen') {
      n.confidenceSource = 'suggested';
      n.confidence = Levels.suggestedConfidence(MODEL, d.id, resp);
    }
  });
  return s;
}

/* In individual mode the single participant's responses are the assessment; in workshop mode, the consensus. */
function respOf(s) {
  if (!s) return {};
  if (s.mode === 'workshop') return s.consensus || {};
  var pid = s.participants && s.participants[0] ? s.participants[0].id : 'p1';
  return (s.responses && s.responses[pid]) || {};
}
function entryFor(s, sid) {
  var r = respOf(s);
  if (!r[sid]) r[sid] = { practice: '', documented: false, note: '' };
  return r[sid];
}
function derived() {
  var s = app.state, resp = respOf(s);
  var prof = Levels.profile(MODEL, resp);
  var con = constrainingOf(MODEL, prof);
  return { resp: resp, prof: prof, con: con, flags: Flags.all(MODEL, prof, s.antiPatterns), notes: Flags.unknownNotes(MODEL, s.antiPatterns) };
}

function setState(mutator, opts) {
  opts = opts || {};
  mutator(app.state);
  app.state.updatedAt = nowISO();
  normalise(app.state);
  app.ui.unsavedToDevice = true;
  app.ui.unprotected = true;
  scheduleSave();
  if (opts.update) opts.update();
  else if (opts.render !== false) renderScreen();
  updateChrome();
}

function scheduleSave() {
  if (!app.ui.storageOK || !app.state) return;
  clearTimeout(app.ui.saveTimer);
  app.ui.saveTimer = setTimeout(function () {
    if (Store.save(app.state)) { app.ui.unsavedToDevice = false; app.ui.unprotected = false; }
    else { app.ui.storageOK = false; renderBanner(); }
    updateChrome();
  }, 500);
}

  if (CONFIG.showBookReferences && d.bookReference) h += '<p class="bookref">' + esc(fill(TPL.bookReference, { reference: d.bookReference })) + '</p>';
  h += '<div class="readout" id="readout-' + dimId + '">' + readoutHTML(dimId) + '</div>';
  h += '<section class="level" aria-labelledby="lv-' + dimId + '-1"><h2 class="level-title" id="lv-' + dimId + '-1"><span class="level-num">Level 1</span>' + esc(ModelMod.levelName(MODEL, 1)) + '</h2>' +
    '<p class="level-desc">' + esc(d.levels['1'].descriptor) + '</p><p class="level-note">' + esc(T.levelOneNote) + '</p></section>';
  for (var n = 2; n <= 5; n++) {
    if (n === 4) h += '<p class="comp-line" id="comp-' + dimId + '">' + esc(T.computabilityLine) + '</p>';
    var quiet = n > ev + 2, firstQuiet = n === ev + 3;
    h += '<section class="level' + (quiet ? ' quiet' : '') + '" id="lvl-' + dimId + '-' + n + '" aria-labelledby="lv-' + dimId + '-' + n + '">' +
      '<h2 class="level-title" id="lv-' + dimId + '-' + n + '"><span class="level-num">Level ' + n + '</span>' + esc(ModelMod.levelName(MODEL, n)) + '</h2>' +
      '<p class="level-desc">' + esc(d.levels[String(n)].descriptor) + '</p>' +
      '<p class="level-note quiet-note"' + (firstQuiet ? '' : ' hidden') + '>' + esc(T.quietLevels) + '</p>';
    d.levels[String(n)].statements.forEach(function (s) { h += statementHTML(MODEL.idx.statementById[s.id]); });
    h += '</section>';
  }
  var sugg = Levels.unknownCount(MODEL, dimId, resp) > 0;
  h += '<section class="dim-notes" aria-labelledby="dn-' + dimId + '"><h2 id="dn-' + dimId + '">Confidence, evidence and notes</h2>' +
    '<fieldset class="field"><legend>How confident is the team in these answers?</legend><div class="choice-row">';
  ['low', 'medium', 'high'].forEach(function (c) {
    h += '<label class="choice"><input type="radio" name="conf-' + dimId + '" id="conf-' + dimId + '-' + c + '" value="' + c + '" data-action="confidence" data-dim="' + dimId + '"' + (dn.confidence === c ? ' checked' : '') + '> ' + c.charAt(0).toUpperCase() + c.slice(1) + '</label>';
  });
  h += '</div><p class="quiet-text" id="conf-note-' + dimId + '" style="margin-top:8px"' + (sugg && dn.confidenceSource !== 'chosen' ? '' : ' hidden') + '>' + esc(TPL.confidenceSuggested) + '</p></fieldset>';
  h += '<div class="field"><label for="ev-' + dimId + '">Evidence</label><p class="hint">What the team can point to: documents, audit results, examples from recent change.</p><textarea id="ev-' + dimId + '" data-action="dimnote" data-dim="' + dimId + '" data-key="evidence" placeholder="' + esc(T.notePlaceholder) + '">' + esc(dn.evidence) + '</textarea></div>';
  h += '<div class="field"><label for="dnotes-' + dimId + '">Notes</label><textarea id="dnotes-' + dimId + '" data-action="dimnote" data-dim="' + dimId + '" data-key="notes" placeholder="' + esc(T.notePlaceholder) + '">' + esc(dn.notes) + '</textarea></div></section>';
  var nb = neighbours(dimId);
  return h + pager(nb.prev, nb.next) + '</div>';
}

/* Targeted refresh after a response changes, so focus and scroll stay where the user is working. */
function refreshDimension(dimId) {
  var resp = respOf(app.state), ev = Levels.evidenced(MODEL, dimId, resp);
  var ro = document.getElementById('readout-' + dimId);
  if (ro) ro.innerHTML = readoutHTML(dimId);
  for (var n = 2; n <= 5; n++) {
    var sec = document.getElementById('lvl-' + dimId + '-' + n);
    if (!sec) continue;
    sec.classList.toggle('quiet', n > ev + 2);
    var qn = sec.querySelector('.quiet-note');
    if (qn) qn.hidden = n !== ev + 3;
  }
  var dn = app.state.dimensionNotes[dimId];
  var radio = document.getElementById('conf-' + dimId + '-' + dn.confidence);
  if (radio) radio.checked = true;
  var cn = document.getElementById('conf-note-' + dimId);
  if (cn) cn.hidden = !(Levels.unknownCount(MODEL, dimId, resp) > 0 && dn.confidenceSource !== 'chosen');
  if (app.ui.lastEv[dimId] !== undefined && app.ui.lastEv[dimId] !== ev) announce(fill(TPL.levelAnnounce, { level: ModelMod.levelName(MODEL, ev) }));
  app.ui.lastEv[dimId] = ev;
  renderRail();
}

/* ---------- screen: anti-pattern check ---------- */

function renderAntiPatterns() {
  var h = '<div class="screen"><h1 tabindex="-1">Anti-pattern check</h1><p class="lead">' + esc(T.antiPatternIntro) + '</p>';
  MODEL.antiPatterns.forEach(function (ap) {
    var r = app.state.antiPatterns[ap.id] || { response: '', note: '' }, key = 'ap-' + ap.id, open = !!app.ui.openNotes[key];
    h += '<section class="ap" aria-labelledby="aph-' + ap.id + '"><h2 id="aph-' + ap.id + '">' + esc(ap.name) + '</h2>' +
      '<p class="linked">Tests: ' + esc(listJoin(ap.linked.map(function (id) { return MODEL.idx.dimById[id].name; }))) + '</p>' +
      '<fieldset><legend>' + esc(ap.question) + '</legend><div class="choice-row">';
    MODEL.antiPatternScale.forEach(function (o) {
      h += '<label class="choice"><input type="radio" name="apr-' + ap.id + '" id="apr-' + ap.id + '-' + o.id + '" value="' + o.id + '" data-action="ap-response" data-ap="' + ap.id + '"' + (r.response === o.id ? ' checked' : '') + '> ' + esc(o.label) + '</label>';
    });
    h += '</div></fieldset><div class="st-extra"><button type="button" class="btn-link" id="nt-' + key + '" data-action="toggle-note" data-st="' + key + '" aria-expanded="' + open + '" aria-controls="nw-' + key + '">' + noteToggleLabel(open, r.note) + '</button></div>' +
      '<div class="note-wrap" id="nw-' + key + '"' + (open ? '' : ' hidden') + '><label for="n-' + key + '">Note on ' + esc(ap.name.toLowerCase()) + '</label>' +
      '<textarea id="n-' + key + '" data-action="ap-note" data-ap="' + ap.id + '" placeholder="' + esc(T.notePlaceholder) + '">' + esc(r.note) + '</textarea></div></section>';

  return h + pager(nb.prev, nb.next) + '</div>';

/* ---------- screen: profile ---------- */

function chartRows(d) {
  return MODEL.dimensions.map(function (dim) { return { id: dim.id, name: dim.name, ev: d.prof[dim.id].ev, cl: d.prof[dim.id].cl, constraining: dim.id === d.con.id }; });
}
function isCompact() { var w = $screen.clientWidth || window.innerWidth; return w < 640; }

function constrainingHTML(d) {
  var dim = MODEL.idx.dimById[d.con.id], lvl = ModelMod.levelName(MODEL, d.prof[d.con.id].ev);
  var intro = d.con.ties.length
    ? fill(TPL.constrainingTie, { dimension: dim.name, level: lvl, others: listJoin(d.con.ties.map(function (id) { return MODEL.idx.dimById[id].name; })) })
    : fill(TPL.constrainingIntro, { dimension: dim.name, level: lvl });
  return '<div class="constraining-box keep"><p><strong>' + esc(dim.name) + '</strong></p><p class="prose">' + esc(intro) + ' ' + esc(dim.constrainingText) + '</p></div>';
}

function gapsHTML(d) {
  var pos = [], neg = [];
  MODEL.dimensions.forEach(function (dim, i) {
    var p = d.prof[dim.id];
    if (p.cl > p.ev) pos.push({ dim: dim, p: p, g: p.cl - p.ev, i: i });
    else if (p.ev > p.cl) neg.push({ dim: dim, p: p, g: p.ev - p.cl, i: i });
  });
  pos.sort(function (a, b) { return b.g - a.g || a.i - b.i; });
  neg.sort(function (a, b) { return b.g - a.g || a.i - b.i; });
  var h = '';
  if (!pos.length && !neg.length) return '<p class="prose">Claimed and evidenced levels match in every dimension.</p>';
  if (pos.length) {
    h += '<p>Documented above what is practised, largest gap first:</p><ul class="plain-list">' + pos.map(function (x) {
      return '<li><strong>' + esc(x.dim.name) + '</strong>: claimed ' + esc(ModelMod.levelName(MODEL, x.p.cl)) + ', evidenced ' + esc(ModelMod.levelName(MODEL, x.p.ev)) +
        ', <span class="gap-text">a gap of ' + x.g + ' level' + (x.g > 1 ? 's' : '') + '</span>.</li>';
    }).join('') + '</ul>';
  }
  if (neg.length) {
    h += '<p>Practised, not yet documented:</p><ul class="plain-list">' + neg.map(function (x) {
      return '<li><strong>' + esc(x.dim.name) + '</strong>: evidenced ' + esc(ModelMod.levelName(MODEL, x.p.ev)) + ', claimed ' + esc(ModelMod.levelName(MODEL, x.p.cl)) + '.</li>';
    }).join('') + '</ul>';
  }
  return h;
}

var FLAG_ICON = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1 L13 12 L1 12 Z" fill="none" stroke="#9A5F0E" stroke-width="1.6"/></svg>';
var NOTE_ICON = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="2" width="10" height="10" fill="none" stroke="#5B7187" stroke-width="1.6"/></svg>';
var FLAG_KIND = { dependency: 'Dependency flag', antipattern: 'Anti-pattern flag', unknown: 'Note' };

function flagsHTML(d, interactive) {
  if (!d.flags.length && !d.notes.length) return '<p class="prose">No flags have been raised. The dimension responses are consistent with each other and with the anti-pattern check.</p>';
  var h = '';
  d.flags.forEach(function (f) {
    var res = app.state.flagResolutions[f.id];
    h += '<div class="flag-item" id="flag-' + f.id + '"><p class="flag-label">' + FLAG_ICON + FLAG_KIND[f.kind] + '</p><p class="flag-text">' + esc(f.text) + '</p>';
    if (res && res.status === 'stands') h += '<p class="flag-status"><strong>Level stands.</strong> Rationale: ' + esc(res.rationale) + '</p>';
    else if (res && res.status === 'revisited') h += '<p class="flag-status"><strong>Revisited.</strong> The dimension was reopened for review.</p>';
    else h += '<p class="flag-status">Not yet resolved.</p>';
    if (interactive) {
      if (app.ui.flagEditing === f.id) {
        h += '<div class="rationale-entry field"><label for="rat-' + f.id + '">Why the level stands (one line)</label>' +
          (app.ui.flagError ? '<p class="field-error" id="rat-' + f.id + '-err">' + esc(app.ui.flagError) + '</p>' : '') +
          '<input type="text" id="rat-' + f.id + '" maxlength="240" value="' + esc(res && res.rationale || '') + '"' + (app.ui.flagError ? ' aria-invalid="true" aria-describedby="rat-' + f.id + '-err"' : '') + '>' +
          '<div class="flag-actions" style="margin-top:8px"><button type="button" class="btn btn-small btn-primary" data-action="flag-save" data-flag="' + f.id + '">Record rationale</button>' +
          '<button type="button" class="btn-link" data-action="flag-cancel">Cancel</button></div></div>';
      } else {
        var target = f.kind === 'dependency' ? f.dims[0] : f.dims[0];
        h += '<div class="flag-actions"><button type="button" class="btn btn-small" data-action="flag-revisit" data-flag="' + f.id + '" data-dim="' + target + '">Revisit ' + esc(MODEL.idx.dimById[target].name) + '</button>' +
          '<button type="button" class="btn btn-small" data-action="flag-stands" data-flag="' + f.id + '">' + (res && res.status === 'stands' ? 'Change rationale' : 'Level stands') + '</button></div>';
      }
    }
    h += '</div>';
  });
  d.notes.forEach(function (n) {
    h += '<div class="flag-item note-item"><p class="flag-label">' + NOTE_ICON + 'Note</p><p class="flag-text">' + esc(n.text) + '</p></div>';
  });
  return h;
}

function implicationsHTML(d) {
  var below = MODEL.dimensions.filter(function (dim) { return d.prof[dim.id].ev < 4; });
  if (!below.length) return '<p class="prose">' + esc(T.implicationsNone) + '</p>';
  return '<p>Evidenced below Sustained:</p><ul class="plain-list">' + below.map(function (dim) {
    return '<li>' + esc(dim.name) + ' (' + esc(ModelMod.levelName(MODEL, d.prof[dim.id].ev)) + ')</li>';
  }).join('') + '</ul><p class="prose">' + esc(T.implicationsText) + '</p>';
}

function renderProfile() {
  var d = derived(), rows = chartRows(d), compact = isCompact();
  app.ui.compact = compact;
  var animate = !app.ui.chartAnimated;
  var h = '<div class="screen"><h1 tabindex="-1">Profile</h1><p class="lead">' + esc(T.profileIntro) + '</p></div>';
  h += '<div class="chart-wrap' + (animate ? ' animate' : '') + '">' + Chart.svg(MODEL, rows, { compact: compact }) + '</div>' + Chart.legend();
  h += '<div class="screen"><button type="button" class="btn-link" data-action="toggle-table" aria-expanded="' + app.ui.showTable + '">' + (app.ui.showTable ? 'Hide the data table' : 'Show the data table') + '</button>' +
    '<div id="profile-table" class="' + (app.ui.showTable ? '' : 'sr-only') + '">' + Chart.table(MODEL, rows) + '</div>';
  h += '<h2>Constraining dimension</h2>' + constrainingHTML(d);
  h += '<h2>Claimed and evidenced</h2>' + gapsHTML(d);
  h += '<h2>Flags</h2><p class="quiet-text">Flags are prompts for discussion. They never change a level on their own, but each needs a recorded resolution.</p>' + flagsHTML(d, true);
  h += '<h2>Implications for automated use</h2>' + implicationsHTML(d);
  var nb = neighbours('profile');
  return h + pager(nb.prev, nb.next) + '</div>';
}

/* ---------- screen: next steps ---------- */

function renderNextSteps() {
  var d = derived(), groups = NextSteps.derive(MODEL, d.resp, d.prof, d.con.id);
  var h = '<div class="screen"><h1 tabindex="-1">Next steps</h1><p class="lead">' + esc(T.nextStepsIntro) + '</p>';
  groups.forEach(function (g) {
    h += '<section class="ns-group" aria-labelledby="nsg-' + g.dim + '"><h2 id="nsg-' + g.dim + '">' + esc(g.name) + '</h2>' +
      '<p class="quiet-text">' + (g.constraining ? 'Constraining dimension. ' : '') + 'Evidenced level: ' + esc(ModelMod.levelName(MODEL, g.ev)) + '.' +
      (g.ev < 5 ? ' Next level: ' + esc(ModelMod.levelName(MODEL, g.ev + 1)) + '.' : '') + '</p>';
    if (g.ev >= 5) h += '<p class="prose">' + esc(T.topLevelReached) + '</p>';
    else {
      h += '<h3>Next step</h3>';
      g.next.forEach(function (s) {
        var ns = app.state.nextSteps[s.id] || { priority: false, owner: '', note: '' };
        h += '<div class="ns-item"><p class="ns-action">' + esc(s.action) + ' <span class="ns-id">' + s.id + '</span></p><div class="ns-fields">' +
          '<label class="doc"><input type="checkbox" id="nsp-' + s.id + '" data-action="ns-priority" data-st="' + s.id + '"' + (ns.priority ? ' checked' : '') + '>Agreed priority</label>' +
          '<div><label class="small" for="nso-' + s.id + '">Owner</label><input type="text" id="nso-' + s.id + '" data-action="ns-text" data-key="owner" data-st="' + s.id + '" value="' + esc(ns.owner) + '"></div>' +
          '<div><label class="small" for="nsn-' + s.id + '">Note</label><input type="text" id="nsn-' + s.id + '" data-action="ns-text" data-key="note" data-st="' + s.id + '" value="' + esc(ns.note) + '" placeholder="' + esc(T.notePlaceholder) + '"></div></div></div>';
      });
    }
    if (g.gaps.length) {
      h += '<h3>Evidence gaps</h3>' + g.gaps.map(function (s) {
        return '<div class="gap-item"><span class="gap-label">Documented, not yet practised</span>' + esc(s.text) + ' <span class="ns-id">' + s.id + '</span></div>';
      }).join('');
    }
    h += '</section>';
  });
  var nb = neighbours('next');
  return h + pager(nb.prev, nb.next) + '</div>';
}

/* ---------- report ---------- */

function reportHTML(opts) {
  opts = opts || {};
  var s = app.state, d = derived(), rows = chartRows(d), sc = s.scope;
  var groups = NextSteps.derive(MODEL, d.resp, d.prof, d.con.id);
  var h = '<article class="report">';
  h += '<h1>' + esc(sc.title || 'Untitled assessment') + '</h1><p>' + esc(CONFIG.toolTitle) + '</p>';
  h += '<table class="data meta-table"><tbody>' +
    '<tr><td>Organisation or service</td><td>' + esc(sc.organisation || 'Not given') + '</td></tr>' +
    '<tr><td>Unit of assessment</td><td>' + esc(UNIT_LABELS[sc.unit] || 'Not given') + '</td></tr>' +
    '<tr><td>Priority data</td><td>' + esc(sc.priorityData.length ? sc.priorityData.join(', ') : 'Not given') + '</td></tr>' +

    '<tr><td>Mode</td><td>Individual assessment</td></tr>' +
    (sc.facilitator ? '<tr><td>Facilitator</td><td>' + esc(sc.facilitator) + '</td></tr>' : '') +
